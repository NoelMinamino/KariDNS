options {
    tcp-idle-timeout 10000;
    version none
    server-id "a"; nsid "b";
    minimal-responses auth;
    max-udp-size big;
    udp-recvbuf-size 65536; udp-receive-buffer 131072;
    max-zone-ttl P1D;
    masterfile-format raw;
    check-names nobody fail;
    check-mx maybe;
    dnstap { auth; socket "/x"; };
    dnstap-output file "/var/log/x" size 10m;
    fstrm-set-output-queue-model fifo;
    catalog-zones { zone "c.test" default-primaries { 192.0.2.1; } default-masters { 192.0.2.2; }; zone "C.test."; };
};
zone "z.test" {
    type primary;
    file "z";
    allow-update { any; };
    update-policy { deny k tcp-self x A; grant k zonesub A(3); grant k everything x A; grant k wildcard w.z.test. A; };
    update-policy local;
};
