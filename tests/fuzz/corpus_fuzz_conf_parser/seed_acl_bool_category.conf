// Phase 12 seed: named acls (nested, negated, keys), booleans in every form, category lists, type case
key "k1" { algorithm hmac-sha256; secret "k7e8vW8f0W4v9B+5Y8f0W4v9B+5Y8f0W4v9B+5Y8f0U="; };
acl "inner" { 192.0.2.0/24; !192.0.2.9; };
acl xfr { inner; 2001:db8::/32; key k1; };
acl "blocked" { 198.51.100.66; none; };
options {
    port 5353;
    serve-stale TRUE;
    minimal-any 0;
    send-extended-errors Yes;
    additional-from-auth In-Domain;
    ecs-trusted-resolvers { inner; };
    rate-limit { responses-per-second 5; log-only 1; early-drop False; };
};
dnstap { socket "/tmp/dt.sock"; log-queries yes; log-responses 0; require-connect no; };
logging {
    channel q { file "q.log" versions 3 size 1K suffix timestamp; print-time true; print-category 1; print-severity no; };
    channel r { file "r.log"; };
    category queries { q; r; };
    category responses { r; };
};
view "v" {
    match-clients { !blocked; any; };
    zone "example.test" { type Master; file "example.test.zone"; allow-transfer { xfr; };
                          allow-update { !blocked; k1; key "k1"; }; catalog-zone no; disable-auto-tc-flag 1; };
};
