// primaries / masters with list names, ports and keys; notify modes in options, view and zone (BIND 9.20)
key "nk" { algorithm hmac-sha256; secret "bmstdGVzdC1zZWNyZXQ="; };
options { notify explicit; };
remote-servers grp port 5301 { 192.0.2.7; inner key "nk"; };
masters inner { 2001:db8::7 port 5302; };
view "v" {
    match-clients { any; };
    notify master-only;
    zone "s.test" { type slave; tsig-key "nk"; primaries port 5300 { grp; inner key nk; 192.0.2.8; }; notify primary-only; };
    zone "t.test" { type slave; masters { 192.0.2.9 port 5353 key nk; }; notify no; };
    zone "u.test" { type master; file "u.zone"; notify yes; };
};
