// BIND compatibility batch 1: directory, class after zone / view names, zone types that are not loaded, port
options {
	directory "/var/named";
	pid-file "run/named.pid";
	port 5353;
	listen-on { 127.0.0.1; };
};
logging { channel q { file "log/q.log"; }; category queries { q; }; };
control-channel { socket "ctl.sock"; algorithm hmac-sha256; secret "c2VjcmV0c2VjcmV0c2VjcmV0c2VjcmV0MTIzNDU2"; };
include "keys.conf";
zone "." IN { type hint; file "root.cache"; };
zone "stub.example" { type stub; masters { 192.0.2.1; }; file "stub.db"; };
zone "static.example" { type static-stub; server-addresses { 192.0.2.2; }; };
zone "mirror.example" in { type mirror; masters { 192.0.2.3 port 5353; }; forwarders { }; };
zone "redirect" { type redirect; file "r.db"; };
zone "example" IN { type primary; file "db.example"; };
zone "abs.example" { type master; file "/srv/abs.db"; };
zone "ch.example" CH { type primary; };
zone "bad.example" { in-view "x"; };
view "v" IN { match-clients { any; }; zone "x.example" in { type primary; file "x.db"; }; };
view "w" HS { };
