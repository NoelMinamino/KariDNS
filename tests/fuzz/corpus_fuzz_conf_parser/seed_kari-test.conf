// ============================================================================
// my_dns テスト用設定ファイル (named.conf)
// ============================================================================
// 対象: dns_server_core.c (フェーズA適用版)
//
// 既知の注意事項:
//   1. user / group ディレクティブはパースはされるが、現状のコードでは
//      options ブロック側の実装漏れにより無視される(setuid/setgidされない)。
//      「効かない」ことを確認するテストとして残してある。将来この行が
//      効くようになったら、起動後に `ps -o user,pid,command -p <pid>` で
//      UIDが "nobody" になっていることを確認すること。
//   2. TSIG(keyブロック、tsig-key)は署名/検証とも未実装(意図的なスタブ)。
//      AXFRのアクセス制御は allow-transfer (IPベースACL) のみで行われる。
//      起動時に syslog へ警告が出ることを確認すること
//      ("TSIG verification is NOT enforced" 系のメッセージ)。
// ============================================================================

options {
    port 10053;
    bind-address {172.31.15.3; 127.0.0.1;};   // テスト機のループバックにのみ待受
    user "nobody";              // 現状は効かない (既知の不具合、上記参照)
    group "nobody";             // 同上
    // Response Rate Limiting (RRL) - DNSリフレクション攻撃対策
    // 指定しない場合はRRLは無効（制限なし）となります

};

// --------------------------------------------------------------------------
// TSIGキー定義 (検証には使われないが、パーサーと起動時警告のテスト用)
// 実運用の鍵ではない。テスト用に openssl rand -base64 33 などで生成したダミー。
// --------------------------------------------------------------------------
key "transfer-key" {
    algorithm hmac-sha256;
    secret "MTIzNDU2Nzg5MGFiY2RlZmdoaWprbG1ub3BxcnN0dXY=";
};

control-channel {
        algorithm hmac-sha256;
        secret "CU3ymLe4wIMscHaWdlmK/xO4ZPNDPkedWbTZ0EOu6A8=";
};


// --------------------------------------------------------------------------
// マスターゾーン: example.com
// フェーズA機能(委任/CNAMEチェーン/ワイルドカード/ネガティブSOA)の
// 主要テストケースをすべて含む。db.example.com を参照。
// --------------------------------------------------------------------------
zone "example.com" {
    type master;
    file "/home/noel/work/my_dns/tests/zones/db.example.com";

    // allow-transfer: ループバックとRFC5737ドキュメント用レンジのみ許可。
    // それ以外からのAXFRはREFUSEDになることを確認するテストに使う。
    allow-transfer {
        127.0.0.1;
	172.31.15.0/24;
        192.0.2.0/24;
    };

//    tsig-key "transfer-key";  // 現状は効かない(上記の注意事項2を参照)
};

// --------------------------------------------------------------------------
// マスターゾーン: child.example.com
// example.com の中で NS 委任されているサブドメインを、
// 同一サーバー上で実体を持つ別ゾーンとして定義(委任+glueのE2Eテスト用)。
// --------------------------------------------------------------------------
zone "child.example.com" {
    type master;
    file "/home/noel/work/my_dns/db.child.example.com";

    allow-transfer {
        any;   // "any" キーワードの動作確認用に、あえて広めに許可
    };
};

// --------------------------------------------------------------------------
// セカンダリ(スレーブ)ゾーンの設定例: example.net
// 実際にAXFR-inさせるには、192.0.2.53 に本サーバー(またはBIND)を
// マスターとして立て、example.net のゾーンをホストしておくこと。
// masters{} が指定されているだけで、コントロールスレッドが1時間毎の
// タイマー(および設定リロード時)にAXFR-in取得を試みる対象になる。
// --------------------------------------------------------------------------
zone "ldns.local" {
    type slave;                 // 値そのものはコード上どちらでも意味を持たない
    masters { 172.31.15.5; };    // masters{}の有無だけで secondary 動作が決まる

    // このサーバー自身がさらに他のセカンダリへ再配布する場合のACL例。
    // pull元(192.0.2.53)からのTSIG検証は行われない点に注意。
    allow-transfer {
        127.0.0.1;
	172.31.15.0/24;
    };
};

// --------------------------------------------------------------------------
// allow-transfer を意図的に設定しないゾーン: noaxfr.example.com
// フェイルクローズ(未設定時はデフォルト拒否)の確認用。
// AXFR要求を送るとどのIPからでもREFUSEDになることを確認する。
// --------------------------------------------------------------------------
zone "noaxfr.example.com" {
    type master;
    file "/home/noel/work/my_dns/db.example.com";  // 内容はexample.comと共用でよい
};


