logging {
    channel a { file "/tmp/a.log" size 10x versions many suffix serial; syslog; null; stderr; };
    channel b { severity debug -1; print-time sometimes; print-category maybe; buffered 2; };
    channel c { syslog nosuchfacility; max-qps -1; };
    channel a { file ""; };
    channel d { file; };
    channel e { file "/tmp/e" size 1m size 2m; rotate 3; };
    category nonsense { a; };
    category queries { undefined_channel; a; a; };
    category default { };
    category { };
    frobnicate yes;
};
controls {
    inet nosuchhost allow { any; };
    inet 127.0.0.1 port 70000 allow { any; };
    inet 127.0.0.1 allow any;
    inet 127.0.0.1 allow { nosuchacl; } keys { missing; } read-only perhaps;
    inet 127.0.0.1 allow { any; } keys keys { };
    unix "/var/run/named.sock" perm 0600 owner 0 group 0;
    snail 1;
};
options { querylog maybe; };
