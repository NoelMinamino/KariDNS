options { directory "/tmp"; querylog yes; };
key "rndc-key" { algorithm hmac-sha256; secret "c2VjcmV0c2VjcmV0c2VjcmV0c2VjcmV0MTIzNDU2"; };
acl trusted { 192.0.2.0/24; };
logging {
    channel simple_log { file "/tmp/named.log" versions 3 size 20m; severity warning; print-time yes; print-severity yes; print-category yes; };
    channel audit_log { file "/tmp/audit.log" size 5m suffix timestamp versions unlimited; severity info; print-time iso8601-utc; };
    channel syslog_ch { syslog local5; severity notice; };
    channel err { stderr; severity debug 3; print-time local; buffered no; };
    channel off { null; };
    channel dyn { stderr; severity dynamic; print-time iso8601; max-qps 100; };
    category default { simple_log; default_syslog; default_debug; };
    category xfer-in { audit_log; };
    category queries { err; off; dyn; };
    category security { syslog_ch; default_stderr; null; };
    category lame-servers { null; };
    category update-security { audit_log; };
};
controls {
    inet 127.0.0.1 port 953 allow { localhost; trusted; } keys { "rndc-key"; } read-only no;
    inet * port * allow { none; };
};
statistics-channels { inet 127.0.0.1 port 8053 allow { 127.0.0.1; }; };
