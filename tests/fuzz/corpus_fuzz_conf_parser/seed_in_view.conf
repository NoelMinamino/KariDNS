options { in-view-settings owner; minimal-responses no-auth; };
view "a" {
    match-clients { 192.0.2.0/24; };
    minimal-responses yes;
    zone "x.example" { type primary; file "x.zone"; max-records-per-type 200; };
    zone "y.example" { type secondary; primaries { 192.0.2.1; }; };
};
view "b" {
    match-clients { any; };
    in-view-settings view;
    zone "x.example" { in-view "a"; allow-query { 198.51.100.0/24; }; allow-transfer { none; }; };
    zone "y.example" { in-view "a"; in-view-settings owner; forward only; forwarders { 192.0.2.53; }; };
};
view "c" {
    match-clients { 2001:db8::/32; };
    zone "x.example" { in-view "b"; };
};
