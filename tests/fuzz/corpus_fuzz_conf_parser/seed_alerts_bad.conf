// alerts { } errors: a statement of the wrong place, ranges, a number that is not one, a missing ; or { , a block that is replaced
options {
    alerts { interval 3601; qps-above -1; servfail-ratio-above 101; rrl-drops-above nan; qps-over 1; };
    alerts { interval 9.5; qps-above 1e308; qps-above 1e999; transfer-failures-above 0x10 };
    alerts qps-above 5;
    alerts { qps-above };
};
zone "a.example.test" { type master; file "a.zone"; alerts { interval 20; }; };
zone "b.example.test" { type master; file "b.zone"; alerts { reload-failures-above 1; }; };
zone "c.example.test" { type master; file "c.zone"; alerts { qps-above 1 }; };
