// alerts { } (KariDNS 0.6.1): options and zone, every statement, limits at the edges
options {
    alerts {
        interval 10;
        qps-above 200000;
        servfail-ratio-above 0.5;
        rrl-drops-above 1000;
        transfer-failures-above 0;
        reload-failures-above 0;
    };
};
zone "a.example.test" {
    type master;
    file "a.zone";
    alerts { qps-above 5000; servfail-ratio-above 100; rrl-drops-above 0; transfer-failures-above 3; };
};
zone "b.example.test" { type master; file "b.zone"; alerts { }; };
