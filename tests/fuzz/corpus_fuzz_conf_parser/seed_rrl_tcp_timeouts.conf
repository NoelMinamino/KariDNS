options {
    port 5353;
    tcp-connection-reuse yes;
    tcp-initial-timeout 1500;
    tcp-idle-timeout 1200;
    rate-limit {
        responses-per-second 5;
        referrals-per-second 3;
        nxdomains-per-second 2;
        all-per-second 50;
        ipv4-prefix-length 32;
        ipv6-prefix-length 64;
        qps-scale 250;
        max-table-size 20000;
        window 5;
        slip 2;
    };
};
zone "example.test" { type primary; file "example.test.zone"; rate-limit { ipv4-prefix-length 16; all-per-second 9; }; };
