options {
    port 10053;
    bind-address { 127.0.0.1; 172.31.15.3;};
    user "nobody";
    group "nobody";
    serve-stale yes;
    send-extended-errors yes;
    minimal-responses no;
    minimal-any no;
    minimal-any-ttl 86400;
    max-mqtypes 4;
    rfc10029-mqtype yes;
   allow-program-zones yes;
   query-log-max-qps 30;
};
dnstap {
    socket "/var/run/dnstap.sock";
    identity "karidns-auth";
    version "0.2.1";
    log-queries yes;       # クエリパケットの取得 (auth-query yes; も可)
    log-responses yes;     # 応答パケットの取得 (auth-response yes; も可)
    queue-size 4096;       # リングバッファ長（既定: 4096）
};

logging {
    channel query_log {
        file "/var/log/karidns/queries.log" versions 5 size 100m;
        severity info;
        print-time yes;
        print-category yes;
    };
    category queries { query_log; };
};


