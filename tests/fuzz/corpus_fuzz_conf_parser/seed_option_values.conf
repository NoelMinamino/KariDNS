options {
    port 5353;
    tcp-initial-timeout 100;
    tcp-idle-timeout 10000ms;
    tcp-advertised-timeout 300;
    tcp-keepalive-timeout 300;
    version "9.99-test";
    hostname none;
    server-id hostname;
    minimal-responses no-auth-recursive;
    max-udp-size 1400;
    udp-receive-buffer 262144;
    udp-send-buffer 262144;
    tcp-receive-buffer 65536;
    tcp-send-buffer 65536;
    edns-udp-size 1232;
    require-server-cookie yes;
    max-records 1000;
    max-records-per-type 100;
    max-types-per-name 20;
    max-zone-ttl 1d;
    serial-update-method date;
    masterfile-format text;
    check-names primary fail;
    check-names secondary warn;
    check-names response ignore;
    check-dup-records warn;
    check-integrity yes;
    check-mx fail;
    check-mx-cname warn;
    check-sibling no;
    check-spf ignore;
    check-srv-cname ignore;
    check-svcb yes;
    check-wildcard yes;
    dnstap { auth; client response; update query; };
    dnstap-output unix "/tmp/dnstap.sock";
    dnstap-identity "id";
    dnstap-version none;
    fstrm-set-buffer-hint 8192;
    fstrm-set-output-queue-model spsc;
    fstrm-set-reopen-interval 5s;
    catalog-zones { zone "catalog.test" default-primaries { 192.0.2.1 port 5353; } zone-directory "/tmp" in-memory yes min-update-interval 5m; };
};
key "upd" { algorithm hmac-sha256; secret "C+Cxy/p+lR2oHn+o8K2ZlJ2C/lH1X4Q+N/k/mN9mN2Y="; };
view v1 {
    match-clients { any; };
    max-udp-size 900;
    require-server-cookie no;
    max-records 50;
    check-names primary ignore;
    catalog-zones { zone "c.test"; };
    zone "example.test" {
        type primary;
        file "example.test.zone";
        check-names warn;
        max-zone-ttl unlimited;
        update-policy {
            deny upd name bad.example.test. A;
            grant upd zonesub A AAAA TXT;
            grant *.dyn.example.test. self x A;
            grant upd selfsub upd CNAME;
            grant upd wildcard *.w.example.test. TXT;
            grant upd krb5-self upd A;
        };
    };
};
