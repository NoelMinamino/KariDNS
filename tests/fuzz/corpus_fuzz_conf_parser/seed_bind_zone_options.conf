view "a" {
  match-clients { any; };
  recursion no;
  allow-query { any; };
  zone-statistics yes;
  zone "example.test" {
    type primary;
    file "/var/db/example.test.zone";
    inline-signing yes;
    dnssec-policy default;
    max-journal-size 1M;
    update-policy { grant example.test zonesub any; };
    notify explicit;
    also-notify { 192.0.2.1; };
  };
};
