// also-notify (BIND 9.20 grammar): options, view, zone; remote-servers / primaries / masters lists; port, key, nested names
key "nk" { algorithm hmac-sha256; secret "bmstdGVzdC1zZWNyZXQ="; };
options {
    also-notify port 5353 { grp; 192.0.2.9 key nk; 2001:db8::9 port 5300; };
};
remote-servers grp port 5301 { 192.0.2.7; inner key "nk"; };
primaries inner { 2001:db8::7 port 5302; };
masters unused { 192.0.2.77; };
view "v" {
    match-clients { any; };
    also-notify { grp; };
    zone "a.test" { type master; file "a.zone"; also-notify { 192.0.2.1 port 5400 key nk; }; };
    zone "b.test" { type master; file "b.zone"; also-notify { }; };
};
