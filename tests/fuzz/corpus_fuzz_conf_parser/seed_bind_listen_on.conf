// BIND compatibility batch 2: listen-on / listen-on-v6 (port per statement, any, none, negation, acl names, localhost), bind-address, blackhole
acl lan { 192.0.2.0/24; { !192.0.2.9; 198.51.100.0/24; }; };
options {
	port 5353;
	bind-address { 127.0.0.1; ::1; };
	listen-on { 127.0.0.1; lan; };
	listen-on port 5300 { !192.0.2.9; 192.0.2.0/24; localhost; };
	listen-on port 5301 proxy plain tls ephemeral http local { any; };
	listen-on-v6 port 5302 { none; };
	listen-on-v6 { !2001:db8::/32; any; };
	listen-on port 65535 { { any; }; };
	blackhole { !192.0.2.1; 192.0.2.0/24; 2001:db8:bad::/48; localnets; };
};
