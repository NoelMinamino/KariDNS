name: KariDNS CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
      - 'feature/**'
      - 'fix/**'
      - 'improve/**'
    # "labeled": adding the "coverage" label to a PR starts the coverage job
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # nightly coverage gate (03:17 JST)
    - cron: '17 18 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-freebsd:
    name: Build and Test on FreeBSD ${{ matrix.release }}
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    # a hung test must fail the job instead of blocking it for hours
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        release: ['14.4', '15.1']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Smoke Test inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1.4.8
        with:
          release: ${{ matrix.release }}
          run: |
            set -e

            echo "::group::📦 [Setup] Install test dependencies (perl5)"
            pkg install -y perl5 || true
            echo "::endgroup::"

            echo "::group::📦 [Build] Parallel Build KariDNS, Sanitizers, Tests & Fuzzers"
            NCPU=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)
            make -j"$NCPU" all asan tsan tools-asan fuzz_all asan_test tinydns_test hash_test include_test response_cache_test vulnerability_test bench_serialize
            echo "::endgroup::"

            echo "::group::🧪 [Unit Tests] All C unit tests (incl. RFC published-vector tests)"
            # Previously only 6 of the C unit tests ran in CI (asan, tinydns, hash, include,
            # response_cache, vulnerability). `unit-tests` builds and runs every binary, sequentially.
            # stdin from /dev/null: no test may block reading the VM session's stdin
            make unit-tests < /dev/null
            echo "::endgroup::"

            echo "::group::🛡️ [Sanitizers] Unit tests under ASan + UBSan"
            # The plain test_* binaries use production CFLAGS, so they are NOT sanitizer-checked
            # (test_asan_overflow included). This rebuilds every unit test with
            # -fsanitize=address,undefined (UBSan findings are fatal); leak checks are off by default
            # (UT_ASAN_LEAKS=1 enables them once the tests' teardown is complete).
            # Burn-in: first FreeBSD run is reported as a warning; remove the fallback to make it blocking.
            make unit-tests-asan < /dev/null || echo "::warning title=unit-tests-asan::ASan/UBSan unit tests failed on FreeBSD ${{ matrix.release }} - see log above (non-blocking during burn-in)"
            echo "::endgroup::"

            echo "::group::🔍 [Smoke Test] Test dag client against Google DNS"
            echo "Testing UDP query..."
            ./dag www.google.com A @8.8.8.8
            
            echo "Testing TCP query..."
            ./dag google.com TXT @8.8.8.8 +tcp

            echo "Testing mutiple UDP query..."
            ./dag www.google.com A @8.8.8.8,9.9.9.9,1.1.1.1

            echo "Testing multiple TCP query..."
            ./dag google.com TXT @8.8.8.8,9.9.9.9,1.1.1.1 +tcp
            echo "::endgroup::"

            echo "::group::🛡️ [Functional & Protocol Tests]"
            sh ./tests/run_paren_check_test.sh
            sh ./tests/run_ttl_suffix_test.sh
            sh ./tests/run_zonemd_val_test.sh
            sh ./tests/run_glue_truncation_test.sh
            sh ./tests/run_mqtype_qdcount0_test.sh
            sh ./tests/run_ixfr_roundtrip_test.sh
            sh ./tests/run_catalog_zone_test.sh
            sh ./tests/run_capsicum_axfr_test.sh
            sh ./tests/run_dynamic_update_test.sh
            sh ./tests/run_roundtrip_test.sh
            sh ./tests/run_karicheck_glue_test.sh
            sh ./tests/run_dag_ci_test.sh
            sh ./tests/run_phase2_core_audit_test.sh
            sh ./tests/run_phase2_audit_part2_test.sh
            sh ./tests/run_tinydns_location_test.sh
            sh ./tests/run_bind_ecs_subnet_test.sh
            sh ./tests/run_response_section_order_test.sh
            sh ./tests/run_sibling_additional_test.sh
            sh ./tests/run_multi_instance_test.sh
            sh ./tests/run_extended_axfr_test.sh
            sh ./tests/run_dnstap_capture_test.sh
            sh ./tests/run_karicheck_semantic_lint_test.sh
            sh ./tests/run_karictl_observatory_test.sh
            sh ./tests/run_axfr_multikey_tsig_test.sh
            sh ./tests/run_config_duplicate_rejection_test.sh
            sh ./tests/run_cve_coo_test.sh
            sh ./tests/run_dag_batch_advanced_opts_test.sh
            sh ./tests/run_dag_fuzzer_test.sh
            sh ./tests/run_dnssec_negative_soa_rrsig_test.sh
            sh ./tests/run_domain_length_rfc1035_test.sh
            sh ./tests/run_ds_delegation_test.sh
            sh ./tests/run_karictl_reload_reconfig_test.sh
            sh ./tests/run_logging_channel_validation_test.sh
            sh ./tests/run_mx_srv_glue_test.sh
            sh ./tests/run_notify_source_test.sh
            sh ./tests/run_privilege_drop_root_test.sh
            sh ./tests/run_query_log_rate_limit_test.sh
            sh ./tests/run_response_cache_test.sh
            sh ./tests/run_rrl_window_test.sh
            sh ./tests/run_tinydns_timestamp_test.sh
            sh ./tests/run_ttl_harmonization_test.sh
            sh ./tests/run_ttl_harmonization_update_test.sh
            sh ./tests/run_ttl_rfc2181_clamp_test.sh
            sh ./tests/run_update_slave_notauth_test.sh
            sh ./tests/run_zone_oom_partial_load_test.sh
            sh ./tests/run_zone_type_secondary_test.sh
            echo "::endgroup::"

            echo "::group::🛡️ [Sanitizer & Fuzzing] Run Comprehensive Smoke Tests"
            ./tests/run_sanitizer_smoke_test.sh
            echo "::endgroup::"

            echo ""
            echo "🎉 All FreeBSD builds and smoke tests passed!"

  unit-tests-portable:
    name: Portable unit tests (+ASan/UBSan) on ${{ matrix.name }}
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc >= 2.36 is required for arc4random_buf(); ubuntu-24.04 ships 2.39.
          - os: ubuntu-24.04
            name: Linux (Ubuntu 24.04)
            experimental: false
          # macOS is verified only by CI itself (not locally): non-blocking until the first green run.
          - os: macos-14
            name: macOS 14 (ARM64)
            experimental: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev zlib1g-dev libidn2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 zlib libidn2
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          LIBIDN2_PREFIX=$(brew --prefix libidn2 2>/dev/null || echo "")
          echo "PKG_CONFIG_PATH=${OPENSSL_PREFIX}/lib/pkgconfig:${LIBIDN2_PREFIX}/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      # The server core needs FreeBSD (kqueue/Capsicum) and is covered by the FreeBSD job. These are
      # the unit tests that do not touch FreeBSD-only APIs: cidr, tinydns parser, ASan-boundary,
      # config include, dnstap, EDNS/cookies, RRL, RFC published vectors, dag tools.
      - name: Portable unit tests
        run: |
          make clean
          make unit-tests-portable

      - name: Portable unit tests under ASan + UBSan
        run: |
          make unit-tests-portable-asan

  build-dag-unix:
    name: Build & Smoke Test dag on ${{ matrix.name }}
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (Ubuntu)
          - os: macos-14
            name: macOS 14 (ARM64)
          - os: macos-15
            name: macOS 15 (ARM64)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev zlib1g-dev libidn2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 zlib libidn2
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          LIBIDN2_PREFIX=$(brew --prefix libidn2 2>/dev/null || echo "")
          echo "PKG_CONFIG_PATH=${OPENSSL_PREFIX}/lib/pkgconfig:${LIBIDN2_PREFIX}/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Build dag
        run: |
          make clean
          make dag

      - name: Smoke Test dag queries
        run: |
          echo "::group::🔍 Test dag execution"
          ./dag --help || true
          echo "Testing UDP query..."
          ./dag www.google.com A @8.8.8.8
          echo "Testing TCP query..."
          ./dag google.com TXT @8.8.8.8 +tcp
          echo "Testing multiple UDP query..."
          ./dag www.google.com A @8.8.8.8,9.9.9.9,1.1.1.1
          echo "::endgroup::"

  build-dag-windows:
    name: Build & Smoke Test dag on Windows (MinGW-w64)
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2 and MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libidn2
            make

      - name: Build dag.exe
        shell: msys2 {0}
        run: |
          make clean
          make dag

      - name: Smoke Test dag.exe queries
        shell: msys2 {0}
        run: |
          echo "::group::🔍 Test dag.exe execution"
          ./dag.exe --help || true
          echo "Testing UDP query..."
          ./dag.exe www.google.com A @8.8.8.8
          echo "Testing TCP query..."
          ./dag.exe google.com TXT @8.8.8.8 +tcp
          echo "Testing multiple UDP query..."
          ./dag.exe www.google.com A @8.8.8.8,9.9.9.9,1.1.1.1
          echo "::endgroup::"

  # ---------------------------------------------------------------------------
  # Coverage quality gate (FreeBSD only: the server core needs kqueue/Capsicum).
  # Too slow for every PR, so it runs on pushes to main, nightly, on demand, and
  # for PRs labelled "coverage". `make coverage` builds in parallel, skips the
  # ASan/TSan-only suites (they run in build-and-test-freebsd) and runs the
  # server fault-injection sweep and the dag network sweep in parallel lanes.
  # ---------------------------------------------------------------------------
  coverage-freebsd:
    name: Coverage gate (FreeBSD 15.1)
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'coverage'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: make coverage inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1.4.8
        with:
          release: '15.1'
          copyback: true
          run: |
            set -e

            echo "::group::📦 [Setup] perl5 + LLVM tools matching the base clang"
            # Base llvm-cov on FreeBSD 15 aborts in "show"; the llvmNN-lite package
            # provides llvm-covNN / llvm-profdataNN, which the Makefile picks up.
            V=$(cc --version | sed -n 's/.*clang version \([0-9][0-9]*\).*/\1/p' | head -n 1)
            pkg install -y perl5 "llvm${V}-lite"
            echo "::endgroup::"

            echo "::group::🧪 [Coverage] make coverage"
            START=$(date +%s)
            make coverage < /dev/null
            echo "make coverage took $(( $(date +%s) - START ))s"
            echo "::endgroup::"

            echo "::group::🚦 [Gate] Phase 2 thresholds"
            perl tests/coverage_gate.pl --llvm-cov="llvm-cov${V}" --profdata=coverage.profdata --phase=2 --strict
            echo "::endgroup::"

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage_html
          if-no-files-found: warn
