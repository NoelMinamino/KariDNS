name: KariDNS CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
      - 'feature/**'
      - 'fix/**'
      - 'improve/**'
    types: [opened, synchronize, reopened]
  schedule:
    # nightly coverage gate (03:17 JST)
    - cron: '17 18 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # FreeBSD, per release (14.4, 15.1): the build and the tests are the reusable workflow freebsd.yml (it can also be started alone from the Actions page).
  # One job there builds everything once (./configure --march=none) and checks ./configure, the manual pages and make install; the jobs that run the unit and
  # ASan tests, the functional and the signer / WebAdmin tests, and (15.1) the browser tests only download that build and run tests.  The checks are named
  # "FreeBSD <release> / <job of freebsd.yml>".
  # ---------------------------------------------------------------------------
  freebsd:
    name: FreeBSD ${{ matrix.release }}
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    strategy:
      fail-fast: false
      matrix:
        release: ['14.4', '15.1']
    # actions: write: the build job of freebsd.yml saves the package and compiler caches and deletes the older ones (main / schedule / dispatch runs)
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/freebsd.yml
    with:
      release: ${{ matrix.release }}

  unit-tests-portable:
    name: Portable unit tests (+ASan/UBSan) on ${{ matrix.name }}
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # blocking on both: a failing unit test fails the job (macOS was non-blocking until its first green run, 0.6; green since)
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc >= 2.36 is required for arc4random_buf(); ubuntu-24.04 ships 2.39.
          - os: ubuntu-24.04
            name: Linux (Ubuntu 24.04)
          - os: macos-15
            name: macOS 15 (ARM64)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sh .github/scripts/apt-install.sh libssl-dev zlib1g-dev libidn2-dev   # survives a mirror the runner cannot reach

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 zlib libidn2
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          LIBIDN2_PREFIX=$(brew --prefix libidn2 2>/dev/null || echo "")
          echo "PKG_CONFIG_PATH=${OPENSSL_PREFIX}/lib/pkgconfig:${LIBIDN2_PREFIX}/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      # The server core needs FreeBSD (kqueue/Capsicum) and is covered by the FreeBSD job. These are
      # the unit tests that do not touch FreeBSD-only APIs: cidr, tinydns parser, ASan-boundary,
      # config include, dnstap, EDNS/cookies, RRL, RFC published vectors, dag tools.
      - name: Portable unit tests
        run: |
          ./configure --with-db-drivers=none
          make clean
          make unit-tests-portable

      - name: Portable unit tests under ASan + UBSan
        run: |
          make unit-tests-portable-asan

      # ./configure and config.mk with the make of the system: GNU make 4 (and dash) on Linux, GNU make 3.81 (and bash as sh) on macOS
      - name: configure and config.mk
        run: |
          sh tests/run_configure_test.sh

  # ---------------------------------------------------------------------------
  # karidns-signer (signer/, 0.6.0 item C): Node.js orchestration around BIND's
  # dnssec tools.  This job checks the Node side on its own: the pinned dependency
  # (npm audit) and the unit tests with coverage (functions 100%, lines 90%, the
  # gate of tests/run_signer_unit_test.sh).  The integration tests need the
  # FreeBSD build (karidns-zone, karicheck) and run in the FreeBSD jobs.  It runs
  # when signer/ or this workflow changes (and always on a schedule or by hand).
  # ---------------------------------------------------------------------------
  signer-node:
    name: signer (Node)
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does the change touch the signer?
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          run=true
          base=""
          [ "$EVENT" = "pull_request" ] && base="$PR_BASE"
          [ "$EVENT" = "push" ] && base="$PUSH_BEFORE"
          if [ -n "$base" ] && ! printf '%s' "$base" | grep -Eq '^0+$' && git cat-file -e "$base^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$base" HEAD | grep -Eq '^(signer/|node/|tests/run_signer_unit_test\.sh$|\.github/workflows/ci\.yml$)'; then
              run=false
              echo "signer/, node/ and the unit test are unchanged: the job has nothing to do"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 24
        if: steps.paths.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: signer/package-lock.json

      - name: Install the dependency (pinned, no install scripts)
        if: steps.paths.outputs.run == 'true'
        working-directory: signer
        run: npm ci --ignore-scripts

      - name: npm audit (high and critical fail the job)
        if: steps.paths.outputs.run == 'true'
        working-directory: signer
        run: npm audit --audit-level=high

      - name: Unit tests with the coverage gate (functions 100%, lines 90%)
        if: steps.paths.outputs.run == 'true'
        run: |
          set -o pipefail   # the default shell of a run step is bash -e without pipefail: the exit status of the test must survive the tee
          node --version
          sh tests/run_signer_unit_test.sh < /dev/null | tee /tmp/signer_unit.out
          # a SKIP (no Node 22.13, say) is a failure here: the gate did not run
          if grep -Eq '^[[:space:]]*SKIP' /tmp/signer_unit.out; then echo "::error title=signer (Node)::the unit tests were skipped"; exit 1; fi
          grep -q 'all unit tests passed' /tmp/signer_unit.out

  # ---------------------------------------------------------------------------
  # karidns-webadmin (webadmin/, 0.6.0 items D and E): the HTTP API.  Like the
  # signer job: the pinned dependency (npm audit) and the unit tests with
  # coverage (functions 100%, lines 90%, the gate of
  # tests/run_webadmin_unit_test.sh).  The unit tests need no database server:
  # the HTTP server runs on SQLite3 files made from db/*.sql, the PostgreSQL
  # side against a fake pool.  The integration tests (tests/run_webadmin_test.sh,
  # tests/run_webadmin_pg_test.sh) need the FreeBSD build and run in the FreeBSD
  # jobs.  It runs when webadmin/, node/ (shared with the signer), the SQL files, the manuals (a test compares their tables with the code, and the user manual of the web interface with the screens)
  # or this workflow change (and always on a schedule or by hand).
  # ---------------------------------------------------------------------------
  webadmin-node:
    name: webadmin (Node)
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does the change touch the WebAdmin?
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          run=true
          base=""
          [ "$EVENT" = "pull_request" ] && base="$PR_BASE"
          [ "$EVENT" = "push" ] && base="$PUSH_BEFORE"
          if [ -n "$base" ] && ! printf '%s' "$base" | grep -Eq '^0+$' && git cat-file -e "$base^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$base" HEAD | grep -Eq '^(webadmin/|node/|db/|tests/auth_vectors\.json$|tests/db/pdns_schema\.sqlite3\.sql$|tests/run_webadmin_unit_test\.sh$|karidns-webadmin\.conf\.sample$|docs/karidns-(api|webadmin|webadmin-gui|webadmin-gui-checklist)\.md$|packaging/freebsd/rc\.d/karidns_webadmin$|packaging/freebsd/build_webadmin_pkg\.sh$|signer/|karidns-signer\.conf\.sample$|docs/karidns-signer\.md$|packaging/freebsd/(rc\.d/karidns_signer|build_signer_pkg\.sh|karidns-signer|MANIFEST\.signer\.in)$|README\.md$|\.github/workflows/ci\.yml$)'; then
              run=false
              echo "webadmin/, node/, db/, the manuals and the unit test are unchanged: the job has nothing to do"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 24
        if: steps.paths.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webadmin/package-lock.json

      - name: Install the dependency (pinned, no install scripts)
        if: steps.paths.outputs.run == 'true'
        working-directory: webadmin
        run: npm ci --ignore-scripts

      - name: npm audit (high and critical fail the job)
        if: steps.paths.outputs.run == 'true'
        working-directory: webadmin
        run: npm audit --audit-level=high

      - name: Unit tests with the coverage gate (functions 100%, lines 90%)
        if: steps.paths.outputs.run == 'true'
        run: |
          set -o pipefail   # the default shell of a run step is bash -e without pipefail: the exit status of the test must survive the tee
          node --version
          sh tests/run_webadmin_unit_test.sh < /dev/null | tee /tmp/webadmin_unit.out
          # a SKIP (no Node 22.13, say) is a failure here: the gate did not run
          if grep -Eq '^[[:space:]]*SKIP' /tmp/webadmin_unit.out; then echo "::error title=webadmin (Node)::the unit tests were skipped"; exit 1; fi
          grep -q 'all unit tests passed' /tmp/webadmin_unit.out

  build-dag-unix:
    name: Build & Smoke Test dag on ${{ matrix.name }}
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (Ubuntu)
          - os: macos-15
            name: macOS 15 (ARM64)
          - os: macos-26
            name: macOS 26 (ARM64)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sh .github/scripts/apt-install.sh libssl-dev zlib1g-dev libidn2-dev libxdp-dev libbpf-dev   # survives a mirror the runner cannot reach

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 zlib libidn2
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          LIBIDN2_PREFIX=$(brew --prefix libidn2 2>/dev/null || echo "")
          echo "PKG_CONFIG_PATH=${OPENSSL_PREFIX}/lib/pkgconfig:${LIBIDN2_PREFIX}/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Build dag
        run: |
          ./configure --with-db-drivers=none --with-idn2=yes
          make clean
          make dag

      - name: Smoke Test dag queries
        run: |
          echo "::group::🔍 Test dag execution"
          ./dag --help   # exit 0, as dig -h (no "|| true": a dag that cannot print its help fails here)
          # X-09: queries a local mock server (no real domains or public resolvers)
          sh ./tests/run_ci_dag_smoke.sh
          echo "::endgroup::"

      # +idnin / +idnout end to end against the conversions of dig 9.20 (tests/dag_idn_vectors.tsv); KARIDNS_TEST_REQUIRE=1: a dag without libidn2 fails
      # here instead of SKIPping.  KARIDNS_TEST_NO_DIG=1: the dig of the runner (9.18 on Ubuntu) is not the dig 9.20 the table was made with
      - name: dag IDN (+idnin, +idnout) against dig 9.20
        run: |
          KARIDNS_TEST_REQUIRE=1 KARIDNS_TEST_NO_DIG=1 sh tests/run_dag_idn_test.sh

      - name: Build and test dnsqps (warnings fail; unit tests plain and under ASan/UBSan; CLI and engine test)
        run: |
          sh tests/run_ci_dnsqps.sh

      # AF_XDP end to end on a veth pair in generic XDP mode, two network namespaces (tests/run_dnsqps_xdp_test.sh); a SKIP is a failure
      - name: dnsqps AF_XDP on a veth pair
        if: runner.os == 'Linux'
        run: |
          sudo DNSQPS_TEST_REQUIRE=1 sh tests/run_dnsqps_xdp_test.sh

      # make install-dag, install-man-dag, install-docs-dag with GNU make (tests/run_install_test.sh: only dag is built here; the server, the
      # database parts and the packages are checked by the FreeBSD job)
      - name: make install of dag (GNU make)
        if: runner.os == 'Linux'
        run: |
          sh tests/run_install_test.sh

  build-dag-windows:
    name: Build & Smoke Test dag on Windows (MinGW-w64)
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2 and MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libidn2
            mingw-w64-x86_64-pkgconf
            make
            perl

      # --with-idn2=yes: dag must convert IDNs as dig does on every OS; without pkgconf ./configure did not find libidn2 and built dag without it
      - name: Build dag.exe
        shell: msys2 {0}
        run: |
          ./configure --with-db-drivers=none --with-idn2=yes
          make clean
          make dag

      - name: Smoke Test dag.exe queries
        shell: msys2 {0}
        run: |
          echo "::group::🔍 Test dag.exe execution"
          ./dag.exe --help   # exit 0, as dig -h
          # X-09: queries a local mock server (no real domains or public resolvers)
          DAG=./dag.exe sh ./tests/run_ci_dag_smoke.sh
          echo "::endgroup::"

      - name: dag.exe IDN (+idnin, +idnout) against dig 9.20
        shell: msys2 {0}
        run: |
          DAG=./dag.exe KARIDNS_TEST_REQUIRE=1 KARIDNS_TEST_NO_DIG=1 sh tests/run_dag_idn_test.sh

      - name: Build and test dnsqps.exe
        shell: msys2 {0}
        run: |
          sh tests/run_ci_dnsqps.sh --no-unit

  # ---------------------------------------------------------------------------
  # Coverage quality gate (FreeBSD only: the server core needs kqueue/Capsicum).
  # Runs on every PR (in parallel with the other jobs), on pushes to main, nightly
  # and on demand. It is also the only CI job that runs the whole integration
  # suite on FreeBSD.  Three stages, each in a FreeBSD 15.1 VM of its own:
  #   coverage-build  `make coverage-build` once (instrumented server, tools, loader, unit tests, fuzz harnesses, ASan builds) and the helpers the
  #                   suite would otherwise build in every VM; everything the build made is packed into the artifact cov-bins
  #                   (tests/coverage_pack.sh).
  #   coverage-shard  4 VMs at the same time, each unpacks cov-bins and runs a quarter of the suite (tests/run_all_suite.sh --shard I/4 --pg-clusters:
  #                   the split by the times of tests/suite_durations.tsv, one PostgreSQL cluster per test slot), skipping ASan/TSan-only suites (they run
  #                   in build-and-test-freebsd); part 1 also replays the fuzz corpora.  Every part merges its raw profiles into one file (make
  #                   coverage-shard-merge) and uploads it with its suite status and its summary.tsv (artifact cov-shard-I).  The checkout path is the same
  #                   in all VMs (/home/runner/work/...): the instrumented loader has the path of its profile directory compiled in.
  #   coverage-gate   adds the profiles of the parts (llvm-profdata merge: the same counters as one run of every test), makes the report from the
  #                   instrumented binaries of cov-bins (make coverage-report COV_FROM_SHARDS=1), applies the thresholds, and checks that every part
  #                   is there, that together they ran every selected test once and that no test failed (make coverage-suite-check-shards).  It runs
  #                   when a part failed too, so that the numbers and the failing tests show together.
  # `make coverage` (one host, the whole suite) works as before.  The times of the tests in tests/suite_durations.tsv are refreshed from the artifact
  # suite-durations of a run (tests/TEST_MATRIX.md, "Shards").
  # The job fails when the gate's thresholds are not met or when a test of the suite fails.
  # The VM action copies the whole workspace back to the runner when a step ends: every VM step removes what it does not hand on (tests/coverage_pack.sh clean).
  # ---------------------------------------------------------------------------
  coverage-build:
    name: Coverage build (FreeBSD 15.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: write: the compiler cache is saved and the older one of this ref deleted (main / schedule / dispatch runs only)
    permissions:
      contents: read
      actions: write
    env:
      # 1: this run saves the compiler cache (tests/ci_cache_env.sh); a pull request only reads it
      CI_SAVE_CACHE: ${{ github.event_name != 'pull_request' && '1' || '0' }}
    # the attempt that made cov-bins (artifact cov-bins-attempt-N): the artifacts of every attempt of a run stay, so a name alone can find an old one.
    # A job that is not re-run keeps its outputs: the shards and the gate of any attempt download the build of the attempt that made it
    outputs:
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # the caches (tests/ci_cache_env.sh) before the VM step: the VM action copies the workspace into the VM when its step starts.  The packages
      # are the ones the build job of FreeBSD 15.1 saves (freebsd.yml); the compiler cache is this job's own (other flags, other objects)
      - name: Restore the package cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/pkg
          key: freebsd-pkg-15.1-${{ github.run_id }}
          restore-keys: freebsd-pkg-15.1-

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/ccache
          key: ccache-15.1-cov-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-15.1-cov-

      - name: Instrumented build inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1.4.8
        with:
          release: '15.1'
          copyback: true
          envs: 'CI_SAVE_CACHE'
          run: |
            set -e
            # everything the build makes is newer than this file (tests/coverage_pack.sh pack: no git in the VM needed)
            touch .cov_stamp

            echo "::group::📦 [Setup] the package and compiler caches (tests/ci_cache_env.sh)"
            CI_CCACHE=1; . tests/ci_cache_env.sh
            echo "::endgroup::"

            echo "::group::📦 [Setup] perl5, sqlite3, libpq and libidn2"
            # libpq (postgresql17-client) decides the database drivers of the instrumented loader (COV_DB_DRIVERS: sqlite3 and postgresql, config.mk: DBPG_HAVE)
            # libidn2: dag +idnin / +idnout and karidns-zone idn (tests/run_dag_idn_test.sh, tests/run_karidns_zone_idn_test.sh; ./configure --with-idn2=yes)
            pkg install -y perl5 sqlite3 postgresql17-client libidn2
            echo "::endgroup::"

            echo "::group::🔨 [Coverage] make coverage-build"
            START=$(date +%s)
            # the compiler and the libraries as config.mk says (libpq, when it is installed, decides COV_DB_DRIVERS).  --march=none: the build runs on
            # other runners (coverage-shard), whose CPUs differ from this one's; the helpers and ASan builds made with the plain CFLAGS (zone2sql,
            # fetch_backend, ...) had -march=native and died with SIGILL there (status 132)
            ./configure --march=none --with-idn2=yes
            make coverage-clean coverage-build < /dev/null
            # the helpers tests/run_all_suite.sh builds when they are missing (zone2sql, zone2kdb: the DB tests, fetch_backend: run_db_fetch_test.sh; fake_dbloader: the hostile and lifecycle loader tests);
            # built here once, so that the 4 VMs of coverage-shard do not.  karidns-evict is not needed: the instrumented karidns has the test command
            # (-DKARIDNS_TEST_EVICT).  The loader and karidns-zone have the drivers the suite wants (the same libpq check), so it builds neither
            make zone2sql zone2kdb fetch_backend fake_dbloader < /dev/null
            echo "make coverage-build took $(( $(date +%s) - START ))s"
            ccache -s
            echo "::endgroup::"

            echo "::group::📦 [Pack] the build, for the VMs of coverage-shard and coverage-gate"
            sh tests/coverage_pack.sh pack cov-bins.tar.zst .cov_stamp
            ls -l cov-bins.tar.zst
            sh tests/coverage_pack.sh clean cov-bins.tar.zst
            rm -f .cov_stamp
            # the copyback carries the compiler cache when this run saves it, never the packages (the build job of 15.1 saves those)
            rm -rf .ci-cache/pkg .ci-cache/bin
            [ "$CI_SAVE_CACHE" = 1 ] && du -sh .ci-cache/ccache || rm -rf .ci-cache
            echo "::endgroup::"

      - name: Upload the instrumented build
        uses: actions/upload-artifact@v4
        with:
          name: cov-bins-attempt-${{ github.run_attempt }}
          path: cov-bins.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Save the compiler cache
        if: env.CI_SAVE_CACHE == '1'
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/ccache
          key: ccache-15.1-cov-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Delete the older compiler caches of this ref
        if: env.CI_SAVE_CACHE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tests/ci_cache_prune.sh "ccache-15.1-cov-"

  coverage-shard:
    name: Coverage suite ${{ matrix.shard }}/4 (FreeBSD 15.1)
    needs: coverage-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # before the VM step: the VM action copies the workspace into the VM when its step starts
      - name: Download the instrumented build
        uses: actions/download-artifact@v4
        with:
          name: cov-bins-attempt-${{ needs.coverage-build.outputs.attempt }}

      - name: Restore the package cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/pkg
          key: freebsd-pkg-15.1-${{ github.run_id }}
          restore-keys: freebsd-pkg-15.1-

      - name: Part ${{ matrix.shard }}/4 of the suite inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1.4.8
        with:
          release: '15.1'
          copyback: true
          run: |
            set -e

            # the package cache (tests/ci_cache_env.sh): restored before this step, saved by the build job of main
            . tests/ci_cache_env.sh
            sh tests/ci_portrange.sh   # the ephemeral ports above every test port (CI flake row 85: a client that connects to itself)
            SHARD=${{ matrix.shard }}

            echo "::group::📦 [Setup] perl5 + LLVM tools matching the base clang"
            # Base llvm-cov on FreeBSD 15 aborts in "show"; the llvmNN-lite package
            # provides llvm-covNN / llvm-profdataNN, which the Makefile picks up.
            V=$(cc --version | sed -n 's/.*clang version \([0-9][0-9]*\).*/\1/p' | head -n 1)
            pkg install -y perl5 sqlite3 "llvm${V}-lite"
            # the suite runs the karidns-signer tests (tests/run_signer_*.sh): Node.js, BIND tools, signer/node_modules and webadmin/node_modules (run_webadmin_*.sh), or they SKIP (shown as a note in the suite output)
            # curl: tests/run_release_roundtrip_test.sh talks to the karidns-webadmin API with it
            # bind920 (named, with bind-tools and libidn2): the differential checks against BIND (tests/run_bind_differential_test.sh,
            # tests/run_nsec3_owner_query_test.sh); ldns (ldns-signzone): tests/run_karicheck_zonemd_ldns_test.sh
            pkg install -y node24 npm-node24 bind-tools bind920 ldns curl
            (cd signer && npm ci --ignore-scripts)
            (cd webadmin && npm ci --ignore-scripts)
            echo "::endgroup::"

            echo "::group::📦 [Setup] PostgreSQL for the PostgreSQL driver tier (test_db_pgsql) and the tests that use it"
            # No service: tests/run_all_suite.sh --pg-clusters starts a cluster per test slot as the user postgres (the package makes it).  libpq: the suite
            # builds the loader with the PostgreSQL driver only when pkg-config finds libpq, which is what the instrumented one has
            pkg install -y postgresql17-server postgresql17-client
            export KARIDNS_TEST_PG_USER=postgres
            echo "::endgroup::"

            echo "::group::📦 [Unpack] the instrumented build of coverage-build"
            # tar -m: the files are newer than the sources, no make target rebuilds them (uninstrumented)
            sh tests/coverage_pack.sh unpack cov-bins.tar.zst
            echo "::endgroup::"

            echo "::group::🧪 [Coverage] make coverage-run COV_SHARD=$SHARD/4"
            START=$(date +%s)
            # the suite runs with -j $(sysctl -n hw.ncpu) (Makefile: COV_JOBS).  A failing test does not stop the run (the gate judges the numbers
            # and coverage-gate the suite); a suite that stopped early has no coverage_suite.status, which coverage-gate reports as a missing part
            # --skip-allow tests/ci_skip_allow.txt: a SKIP line that the list does not name fails its test (what this suite checks is fixed there);
            # KARIDNS_TEST_REQUIRE=1: the tests that know it fail instead of SKIPping (libidn2, mandoc)
            export KARIDNS_TEST_REQUIRE=1
            RUN=0
            make coverage-run COV_SHARD="$SHARD/4" COV_SUITE_OPTS="--skip-allow tests/ci_skip_allow.txt" < /dev/null || RUN=$?
            echo "make coverage-run took $(( $(date +%s) - START ))s (exit $RUN)"
            echo "::endgroup::"

            echo "::group::🔎 [Evidence] the checks of this part that SKIPped before 0.7 (IDN, BIND, ldns, the PostgreSQL wrong password)"
            # the log of a passing test is not printed: the lines that show these checks ran (a part has only the tests of its shard)
            grep -h -E '^=== run_(dag|karidns_zone)_idn_test:|a wrong password: exit 4|BIND differential tests matched|equal to BIND named for|karicheck ZONEMD vs ldns: all checks passed' tests/.test_logs/test_*.log || true
            # a query to a test's server that got no answer on a try, in a test that passed (tests/lib_proc.sh kari_noanswer_diag: CI flake rows 9, 90)
            grep -h -E -A70 '^ *(\(note: [0-9]+ of the tries|\[no answer diag\])' tests/.test_logs/test_*.log | grep -v '^ *\[ OK \]' | head -400 || true
            echo "::endgroup::"

            echo "::group::📦 [Result] the profile data and the status of this part"
            mkdir -p shard-out
            [ ! -f coverage_suite.status ] || cp coverage_suite.status "shard-out/shard-$SHARD.status"
            [ ! -f tests/.test_logs/summary.tsv ] || cp tests/.test_logs/summary.tsv "shard-out/shard-$SHARD.summary.tsv"
            [ ! -f tests/.test_logs/skip_lines.tsv ] || cp tests/.test_logs/skip_lines.tsv "shard-out/shard-$SHARD.skip_lines.tsv"
            if [ "$RUN" -eq 0 ]; then
              make coverage-shard-merge COV_SHARD_PROFDATA="shard-out/shard-$SHARD.profdata" < /dev/null
            fi
            ls -l shard-out
            # the build, the raw profiles and the logs stay in the VM (the copyback takes the whole workspace)
            rm -rf coverage_raw tests/.test_logs signer/node_modules webadmin/node_modules .ci-cache
            sh tests/coverage_pack.sh clean cov-bins.tar.zst
            rm -f cov-bins.tar.zst
            echo "::endgroup::"

      - name: Upload the results of this part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cov-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: shard-out
          retention-days: 1
          if-no-files-found: error

      # the part's own verdict (coverage-gate judges all of them, and runs when this one fails)
      - name: Result of part ${{ matrix.shard }}/4
        run: |
          f=shard-out/shard-${{ matrix.shard }}.status
          [ -s "$f" ] || { echo "::error title=Coverage suite ${{ matrix.shard }}/4::the suite stopped before it ran the tests (no status file)"; exit 1; }
          head -n 1 "$f"
          grep -q '^total=[0-9]* passed=[0-9]* failed=0 ' "$f" || { echo "::error title=Coverage suite ${{ matrix.shard }}/4::failing tests: $(sed -n 's/^failed_tests=//p' "$f")"; exit 1; }

  coverage-gate:
    name: Coverage gate (FreeBSD 15.1)
    needs: [coverage-build, coverage-shard]
    if: always() && needs.coverage-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pages: ${{ steps.pages.outputs.ready }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download the instrumented build
        uses: actions/download-artifact@v4
        with:
          name: cov-bins-attempt-${{ needs.coverage-build.outputs.attempt }}

      # the parts that delivered (a part that did not has no artifact: the suite check below names it).  Each attempt of a part uploads
      # cov-shard-N-attempt-M, and the artifacts of the earlier attempts of the run stay: after a re-run the pattern finds them all, and with
      # merge-multiple the files of an old attempt could win (PR #277: the gate of attempt 2 read the failed status of attempt 1 of part 4)
      - name: Download the results of the parts
        uses: actions/download-artifact@v4
        with:
          pattern: cov-shard-*
          path: coverage_parts

      # of each part, the last attempt (the latest result: a part re-run and failing again stays failed)
      - name: Take the last attempt of each part
        run: |
          set -eu
          mkdir -p coverage_shards coverage_parts
          for n in $(ls coverage_parts | sed -n 's/^cov-shard-\([0-9]*\)-attempt-[0-9]*$/\1/p' | sort -n -u); do
            attempts=$(ls coverage_parts | sed -n "s/^cov-shard-$n-attempt-\([0-9]*\)\$/\1/p" | sort -n)
            last=$(echo "$attempts" | tail -n 1)
            echo "part $n: attempt $last (artifacts of the attempts: $(echo $attempts))"
            cp -R "coverage_parts/cov-shard-$n-attempt-$last/." coverage_shards/
          done
          rm -rf coverage_parts
          ls -l coverage_shards

      - name: Restore the package cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/pkg
          key: freebsd-pkg-15.1-${{ github.run_id }}
          restore-keys: freebsd-pkg-15.1-

      # This step ends in success when it got to the end, so that the copyback (vmactions skips it when the run fails) brings back the report and
      # the gate table also when the gate or the suite failed; the results are in coverage_status.txt and the step "Verdict" fails the job on them.
      - name: Merge, report and gate inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1.4.8
        env:
          GATE_NOTE: "commit ${{ github.sha }} (${{ github.ref_name }}), run ${{ github.run_id }} attempt ${{ github.run_attempt }}"
        with:
          release: '15.1'
          copyback: true
          envs: 'GATE_NOTE'
          run: |
            set -e

            # the package cache (tests/ci_cache_env.sh): restored before this step, saved by the build job of main
            . tests/ci_cache_env.sh
            sh tests/ci_portrange.sh   # the ephemeral ports above every test port (CI flake row 85: a client that connects to itself)

            echo "::group::📦 [Setup] perl5 + LLVM tools matching the base clang"
            # Base llvm-cov on FreeBSD 15 aborts in "show"; the llvmNN-lite package
            # provides llvm-covNN / llvm-profdataNN, which the Makefile picks up.
            V=$(cc --version | sed -n 's/.*clang version \([0-9][0-9]*\).*/\1/p' | head -n 1)
            pkg install -y perl5 "llvm${V}-lite"
            sh tests/coverage_pack.sh unpack cov-bins.tar.zst
            ls coverage_shards
            echo "::endgroup::"

            echo "::group::🧪 [Coverage] merge the parts and make the report"
            START=$(date +%s)
            # the steps of `make coverage` after the suite: the profile data of the parts instead of the raw profiles of one run
            REPORT=0
            make coverage-merge-shards coverage-report COV_FROM_SHARDS=1 < /dev/null || REPORT=$?
            echo "merge and report took $(( $(date +%s) - START ))s"
            echo "::endgroup::"

            echo "::group::🚦 [Gate] Phase 2 thresholds"
            GATE=0
            # stdin is the rest of this script (the VM action pipes it to sh): coverage_gate.pl reads a JSON summary from a piped stdin, which ate
            # the lines below ("Failed to parse JSON coverage summary", then "sh: Syntax error: Unterminated quoted string")
            # gate.md: the Job Summary (step "Coverage gate summary"); coverage_html/gate.html: the same table beside the report (GitHub Pages)
            [ "$REPORT" -ne 0 ] || perl tests/coverage_gate.pl --llvm-cov="llvm-cov${V}" --profdata=coverage.profdata --phase=2 --strict \
              --markdown=gate.md --html=coverage_html/gate.html --note="${GATE_NOTE:-}" < /dev/null || GATE=$?
            [ "$REPORT" -eq 0 ] || GATE=$REPORT
            # a link to the table at the top of the llvm-cov report
            if [ -f coverage_html/gate.html ] && [ -f coverage_html/index.html ]; then
              perl -pi -e 's{(<body[^>]*>)}{$1<p><a href="gate.html">Coverage gate: the per-tier table (thresholds, pass/fail)</a></p>}' coverage_html/index.html
            fi
            echo "::endgroup::"

            echo "::group::🧪 [Suite] the status of the parts (success only when all of them ran, every selected test once, with failed=0)"
            SUITE=0
            make coverage-suite-check-shards < /dev/null || SUITE=$?
            echo "::endgroup::"
            [ "$SUITE" -eq 0 ] || echo "::error title=Test suite::failing tests or missing parts: $(cat coverage_shards/*.status 2>/dev/null | sed -n 's/^failed_tests=//p' | tr '\n' ' ')"
            [ "$REPORT" -eq 0 ] || echo "::error title=Coverage report::merging the parts or making the report failed"
            [ "$GATE" -eq 0 ] || echo "::error title=Coverage gate::the phase 2 thresholds are not met"
            # the build and the profiles stay in the VM (the copyback takes the whole workspace)
            sh tests/coverage_pack.sh clean cov-bins.tar.zst
            rm -f cov-bins.tar.zst
            rm -rf .ci-cache
            echo "report=$REPORT gate=$GATE suite=$SUITE" > coverage_status.txt

      - name: Coverage gate summary
        if: always()
        run: |
          if [ -s gate.md ]; then cat gate.md >> "$GITHUB_STEP_SUMMARY"
          else echo "## KariDNS coverage gate: no table (the report was not made, or the VM step stopped before the gate; see its log)" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -s coverage_status.txt ]; then
            if grep -q 'suite=0' coverage_status.txt; then s=passed; else s="**failed** (see the annotation \"Test suite\")"; fi
            printf '\nTest suite of the parts: %s\n' "$s" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage_html
          if-no-files-found: warn

      # GitHub Pages (job coverage-pages): pushes to main of this repository only, never pull requests, forks, schedules or dispatches.  The site
      # is the report under coverage/ (https://noelminamino.github.io/KariDNS/coverage/), the root a redirect to it.
      - name: Prepare the GitHub Pages site
        id: pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NoelMinamino/KariDNS' && hashFiles('coverage_html/index.html') != ''
        run: |
          set -eu
          mkdir -p _site
          cp -R coverage_html _site/coverage
          printf '%s\n' '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>KariDNS coverage</title>' \
            '<meta http-equiv="refresh" content="0; url=coverage/"></head><body><a href="coverage/">KariDNS coverage report</a></body></html>' > _site/index.html
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload the GitHub Pages site
        if: always() && steps.pages.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Verdict
        if: always()
        run: |
          [ -s coverage_status.txt ] || { echo "::error title=Coverage gate::the VM step did not finish (no coverage_status.txt)"; exit 1; }
          cat coverage_status.txt
          grep -q '^report=0 gate=0 suite=0$' coverage_status.txt

      # the times of this run's tests: tests/suite_durations.sh turns them into tests/suite_durations.tsv (tests/TEST_MATRIX.md, "Shards")
      - name: The times of the tests of this run
        if: always()
        run: |
          mkdir -p durations
          if ls coverage_shards/*.summary.tsv >/dev/null 2>&1; then sh tests/suite_durations.sh coverage_shards/*.summary.tsv > durations/suite_durations.tsv; fi

      - name: Upload the times of the tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-durations
          path: durations
          retention-days: 30
          if-no-files-found: ignore

  # The report of the last push to main on GitHub Pages: https://noelminamino.github.io/KariDNS/coverage/ (gate.html there is the per-tier table).
  # The site is made and uploaded by coverage-gate (steps "Prepare the GitHub Pages site" and "Upload the GitHub Pages site", main pushes only); this job
  # only deploys it, with the two permissions deploy-pages needs, in the environment github-pages.
  coverage-pages:
    name: Coverage report on GitHub Pages
    needs: coverage-gate
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NoelMinamino/KariDNS' && needs.coverage-gate.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}coverage/
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
