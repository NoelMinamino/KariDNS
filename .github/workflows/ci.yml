name: KariDNS CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
      - 'feature/**'
      - 'fix/**'
      - 'improve/**'
    types: [opened, synchronize, reopened]
  schedule:
    # nightly coverage gate (03:17 JST)
    - cron: '17 18 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-freebsd:
    name: Build and Test on FreeBSD ${{ matrix.release }}
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    # a hung test must fail the job instead of blocking it for hours.  The 15.1 job took 29 minutes (14.4: 32) before the browser tests of the web interface; they add the
    # install of Firefox (a minute or two) and, on the build host, 1:45 of tests: about 40 minutes expected.  Look at the first run on 15.1 and raise this if it is near 50.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        release: ['14.4', '15.1']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Smoke Test inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1.4.8
        with:
          release: ${{ matrix.release }}
          run: |
            set -e

            echo "::group::📦 [Setup] Install test dependencies (perl5, sqlite3 for karidns-dbloader and its tests)"
            # no "|| true": the manual-page gate below needs perl (a failed install must fail here, as the coverage job does)
            pkg install -y perl5
            pkg install -y sqlite3
            echo "::endgroup::"

            echo "::group::📦 [Setup] Node.js, BIND tools and the npm dependency of karidns-signer (0.6.0 item C)"
            # karidns-signer is Node.js orchestration around BIND's dnssec-keygen / dnssec-signzone / dnssec-verify (bind-tools); signer/ has one
            # npm dependency (pg, exact version in package-lock.json), installed without install scripts.  The signer tests SKIP without these.
            # curl: tests/run_release_roundtrip_test.sh talks to the karidns-webadmin API with it
            pkg install -y node24 npm-node24 bind-tools curl
            (cd signer && npm ci --ignore-scripts)
            (cd webadmin && npm ci --ignore-scripts)
            node --version
            dnssec-signzone -V
            echo "::endgroup::"

            echo "::group::📦 [Setup] Firefox and geckodriver for the browser tests of the web interface (0.6.0 item F, FreeBSD 15.1 only)"
            # run_webadmin_gui_test.sh drives Firefox (headless) through geckodriver; the packages are built for 15.x.  Firefox crashes at the start without a font.
            # The tests use no network (a profile that talks to nothing, everything on 127.0.0.1): the network is for this step only.
            # The packages preinstalled in the VM image can be older than the repository: pkg keeps an installed library whose soname
            # is unchanged (libffi.so.8 lacked the LIBFFI_CALL_PLAN_8.4 symbol version libxul.so needs), so bring them up to date first.
            if [ "${{ matrix.release }}" = "15.1" ]; then
              pkg upgrade -y
              pkg install -y firefox geckodriver dejavu
              firefox --version
              geckodriver --version | head -1
            fi
            echo "::endgroup::"

            echo "::group::📦 [Setup] PostgreSQL server and libpq (PostgreSQL driver of karidns-dbloader, B10)"
            # The job runs inside this VM, so the PostgreSQL "service" is a server started here (a service container of the
            # runner is not reachable from the VM).  initdb's default pg_hba.conf trusts the UNIX socket and 127.0.0.1; the tests
            # create and drop their own databases and roles (karidns_test_*) as the user postgres (tests/db/pg_lib.sh).
            pkg install -y postgresql17-server postgresql17-client
            sysrc postgresql_enable=YES
            service postgresql initdb
            service postgresql start
            export KARIDNS_TEST_PG="host=127.0.0.1 user=postgres"
            export KARIDNS_TEST_PG_USER=postgres
            i=0; until pg_isready -q -h 127.0.0.1 || [ $i -ge 30 ]; do sleep 1; i=$((i + 1)); done
            psql -X -At -h 127.0.0.1 -U postgres -d postgres -c "SELECT version()"
            echo "::endgroup::"

            echo "::group::📦 [Build] Parallel Build KariDNS, Sanitizers, Tests & Fuzzers"
            NCPU=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)
            # configure finds the compiler and the libraries and writes config.mk, which every make below reads (docs/building.md); both database drivers are built
            ./configure --with-db-drivers="sqlite3 postgresql"
            make -j"$NCPU" all karicheck-codelog test_coverage_sweep_tools-codelog karidns-dbloader karidns-zone karidns-zone-asan zone2sql zone2kdb asan tsan tools-asan fuzz_all asan_test tinydns_test hash_test include_test response_cache_test vulnerability_test bench_serialize fetch_backend karidns-evict
            echo "::endgroup::"

            echo "::group::🔧 [Configure] ./configure and config.mk: the same compile lines with and without it (BSD make and GNU make)"
            # tests/run_configure_test.sh works in a copy of the sources; gmake is not installed here, so GNU make is checked by the Linux job
            sh tests/run_configure_test.sh < /dev/null
            echo "::endgroup::"

            echo "::group::📖 [Manual pages] man/ is what make man makes of docs/*.md; mandoc -T lint"
            # tests/run_md2man_test.sh: the converter's fixtures, the committed pages against a fresh man/generate.sh, no mandoc message at WARNING
            # or worse (perl5 is installed above, mandoc is in the base system; KARIDNS_TEST_REQUIRE=1: a missing perl or mandoc is a failure, not a SKIP).
            # A stale page fails here: run make man and commit the pages
            KARIDNS_TEST_REQUIRE=1 sh tests/run_md2man_test.sh < /dev/null
            echo "::endgroup::"

            echo "::group::📦 [Install] make install against tests/install_manifest.txt; the packages list what make install stages"
            # tests/run_install_test.sh in a copy with the binaries built above: make install / uninstall (BSD make), other directories, and
            # build_pkg.sh --no-build for karidns and karidns-db plus the signer and WebAdmin packages (npm ci): their file lists, modes and metadata
            sh tests/run_install_test.sh < /dev/null
            echo "::endgroup::"

            echo "::group::🧪 [Unit Tests] All C unit tests (incl. RFC published-vector tests), 4 at a time"
            # Same tests as `make unit-tests` (plus test_acl_match and test_listen_on), run by tests/run_all_suite.sh: 4 at a time,
            # tests that share a resource (the PostgreSQL server) one after the other, each test with its own log, which is printed
            # in full when the test fails.  The coverage sweeps are not part of unit-tests (the coverage job runs them).
            # Build every test binary in parallel first (stdin from /dev/null: no test may block reading the VM session's stdin).
            make -j"$NCPU" unit-test-bins
            sh tests/run_all_suite.sh -j 4 --test-timeout 1200 --full-log -c unit -e coverage_sweep < /dev/null
            echo "::endgroup::"

            echo "::group::🛡️ [Sanitizers] Unit tests under ASan + UBSan, 4 at a time"
            # The plain test_* binaries use production CFLAGS, so they are NOT sanitizer-checked
            # (test_asan_overflow included). This rebuilds every unit test with
            # -fsanitize=address,undefined (UBSan findings are fatal); leak checks are off by default
            # (UT_ASAN_LEAKS=1 enables them once the tests' teardown is complete).
            # Blocking: any ASan/UBSan unit-test failure fails the job (a missing -asan binary too).
            # -j: the ASan binaries (each links ~18 objects) build in parallel; --asan then runs the same binaries as
            # make unit-tests-asan does (tests/run_unit_with_watchdog.sh, UT_TIMEOUT 300 s each), 4 at a time; like it, not the test_fi_* fault-injection tests (no -asan build)
            make -j"$NCPU" unit-test-bins-asan < /dev/null
            sh tests/run_all_suite.sh -j 4 --test-timeout 1200 --full-log --asan -e coverage_sweep,test_fi_ < /dev/null
            echo "::endgroup::"

            echo "::group::🔍 [Smoke Test] Test dag client against a local mock server"
            # X-09: no real domains or public resolvers (UDP, TCP, multiple servers, AXFR)
            sh ./tests/run_ci_dag_smoke.sh
            echo "::endgroup::"

            echo "::group::🛡️ [Functional & Protocol Tests] 4 at a time"
            # The tests of this list, run by tests/run_all_suite.sh: 4 at a time, each in its own port window and temporary directory (KARI_PORT_BASE,
            # KARI_TMP); the ones that share a resource (loopback aliases, one server's files, fixed ports) are registered as group or serial there
            # and run one at a time.  A failed test prints its whole log.  --tests refuses a name that is not registered.
            FUNC_TESTS="\
              run_paren_check_test,run_ttl_suffix_test,run_zonemd_val_test,run_glue_truncation_test,run_mqtype_qdcount0_test,\
              run_ixfr_roundtrip_test,run_catalog_zone_test,run_capsicum_axfr_test,run_dynamic_update_test,run_roundtrip_test,\
              run_karicheck_glue_test,run_dag_ci_test,run_phase2_core_audit_test,run_phase2_audit_part2_test,run_tinydns_location_test,\
              run_bind_ecs_subnet_test,run_response_section_order_test,run_sibling_additional_test,run_multi_instance_test,\
              run_extended_axfr_test,run_dnstap_capture_test,run_karicheck_semantic_lint_test,run_db_dump_test,run_db_sqlite_basic_test,\
              run_db_file_diff_test,run_db_hostile_loader_test,run_db_ddl_test,run_db_schema_migrate_test,run_db_pg_sqlite_diff_test,\
              run_db_pg_autoreload_test,run_db_pg_role_test,run_db_auth_schema_test,run_db_auth_rls_test,\
              run_karicheck_database_conf_test,run_karicheck_json_test,run_karicheck_codes_test,run_dag_update_generic_rdata_test,\
              run_karictl_observatory_test,run_axfr_multikey_tsig_test,run_config_duplicate_rejection_test,run_cve_coo_test,\
              run_dag_batch_advanced_opts_test,run_dag_fuzzer_test,run_dnssec_negative_soa_rrsig_test,run_domain_length_rfc1035_test,\
              run_ds_delegation_test,run_karictl_reload_reconfig_test,run_logging_channel_validation_test,run_mx_srv_glue_test,\
              run_notify_source_test,run_privilege_drop_root_test,run_nonroot_startup_test,run_query_log_rate_limit_test,\
              run_response_cache_test,run_rrl_window_test,run_tinydns_timestamp_test,run_ttl_harmonization_test,\
              run_ttl_harmonization_update_test,run_ttl_rfc2181_clamp_test,run_update_secondary_refused_test,\
              run_zone_oom_partial_load_test,run_zone_type_secondary_test"
            sh ./tests/run_all_suite.sh -j 4 --test-timeout 1200 --full-log --tests "$FUNC_TESTS" < /dev/null
            echo "::endgroup::"

            echo "::group::🔏 [Signer, WebAdmin] karidns-signer and karidns-webadmin: unit tests, SQLite3 and PostgreSQL (root: with a server)"
            # A SKIP of a whole script must fail here (tests/run_all_suite.sh shows it as a note of a PASS): node24, bind-tools, signer/node_modules and webadmin/node_modules are installed above
            # The browser tests of the web interface (the sign-in with a provider among them: its browser part) run on 15.1 only (Firefox is installed there); a SKIP fails the job like any other
            GUI_TEST=""
            if [ "${{ matrix.release }}" = "15.1" ]; then GUI_TEST="run_webadmin_gui_test,run_webadmin_gui_pg_test,run_webadmin_oidc_test"; fi
            NODE_TESTS="run_signer_unit_test,run_signer_test,run_signer_pg_test,run_webadmin_unit_test,run_webadmin_test,run_webadmin_pg_test,run_webadmin_write_test,run_webadmin_write_pg_test,run_webadmin_versions_test,run_webadmin_versions_pg_test,run_webadmin_pkg_test,run_signer_pkg_test,run_release_roundtrip_test"
            # 4 at a time through tests/run_all_suite.sh.  --serial-as-par: the browser tests are registered "serial" there (the others run next to the other tests since 0.6.2); every one of them
            # takes its ports (kari_port), its directory (mktemp) and its PostgreSQL roles and databases ($$) of its own.  --fail-on-skip: a test that exits 0 but prints a SKIP line
            # fails the job, as the loop did before
            sh ./tests/run_all_suite.sh -j 4 --test-timeout 1200 --serial-as-par --full-log --fail-on-skip --tests "$NODE_TESTS" < /dev/null
            # the browser tests one after the other (a Firefox each; the memory of the VM)
            if [ -n "$GUI_TEST" ]; then sh ./tests/run_all_suite.sh -j 1 --test-timeout 600 --full-log --fail-on-skip --tests "$GUI_TEST" < /dev/null; fi
            echo "::endgroup::"

            echo "::group::🛡️ [Sanitizer & Fuzzing] Run Comprehensive Smoke Tests"
            ./tests/run_sanitizer_smoke_test.sh
            echo "::endgroup::"

            echo ""
            echo "🎉 All FreeBSD builds and smoke tests passed!"

  unit-tests-portable:
    name: Portable unit tests (+ASan/UBSan) on ${{ matrix.name }}
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc >= 2.36 is required for arc4random_buf(); ubuntu-24.04 ships 2.39.
          - os: ubuntu-24.04
            name: Linux (Ubuntu 24.04)
            experimental: false
          # macOS is verified only by CI itself (not locally): non-blocking until the first green run.
          - os: macos-15
            name: macOS 15 (ARM64)
            experimental: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sh .github/scripts/apt-install.sh libssl-dev zlib1g-dev libidn2-dev   # survives a mirror the runner cannot reach

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 zlib libidn2
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          LIBIDN2_PREFIX=$(brew --prefix libidn2 2>/dev/null || echo "")
          echo "PKG_CONFIG_PATH=${OPENSSL_PREFIX}/lib/pkgconfig:${LIBIDN2_PREFIX}/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      # The server core needs FreeBSD (kqueue/Capsicum) and is covered by the FreeBSD job. These are
      # the unit tests that do not touch FreeBSD-only APIs: cidr, tinydns parser, ASan-boundary,
      # config include, dnstap, EDNS/cookies, RRL, RFC published vectors, dag tools.
      - name: Portable unit tests
        run: |
          ./configure --with-db-drivers=none
          make clean
          make unit-tests-portable

      - name: Portable unit tests under ASan + UBSan
        run: |
          make unit-tests-portable-asan

      # ./configure and config.mk with the make of the system: GNU make 4 (and dash) on Linux, GNU make 3.81 (and bash as sh) on macOS
      - name: configure and config.mk
        run: |
          sh tests/run_configure_test.sh

  # ---------------------------------------------------------------------------
  # karidns-signer (signer/, 0.6.0 item C): Node.js orchestration around BIND's
  # dnssec tools.  This job checks the Node side on its own: the pinned dependency
  # (npm audit) and the unit tests with coverage (functions 100%, lines 90%, the
  # gate of tests/run_signer_unit_test.sh).  The integration tests need the
  # FreeBSD build (karidns-zone, karicheck) and run in the FreeBSD jobs.  It runs
  # when signer/ or this workflow changes (and always on a schedule or by hand).
  # ---------------------------------------------------------------------------
  signer-node:
    name: signer (Node)
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does the change touch the signer?
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          run=true
          base=""
          [ "$EVENT" = "pull_request" ] && base="$PR_BASE"
          [ "$EVENT" = "push" ] && base="$PUSH_BEFORE"
          if [ -n "$base" ] && ! printf '%s' "$base" | grep -Eq '^0+$' && git cat-file -e "$base^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$base" HEAD | grep -Eq '^(signer/|node/|tests/run_signer_unit_test\.sh$|\.github/workflows/ci\.yml$)'; then
              run=false
              echo "signer/, node/ and the unit test are unchanged: the job has nothing to do"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 24
        if: steps.paths.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: signer/package-lock.json

      - name: Install the dependency (pinned, no install scripts)
        if: steps.paths.outputs.run == 'true'
        working-directory: signer
        run: npm ci --ignore-scripts

      - name: npm audit (high and critical fail the job)
        if: steps.paths.outputs.run == 'true'
        working-directory: signer
        run: npm audit --audit-level=high

      - name: Unit tests with the coverage gate (functions 100%, lines 90%)
        if: steps.paths.outputs.run == 'true'
        run: |
          node --version
          sh tests/run_signer_unit_test.sh < /dev/null | tee /tmp/signer_unit.out
          # a SKIP (no Node 22.13, say) is a failure here: the gate did not run
          if grep -Eq '^[[:space:]]*SKIP' /tmp/signer_unit.out; then echo "::error title=signer (Node)::the unit tests were skipped"; exit 1; fi
          grep -q 'all unit tests passed' /tmp/signer_unit.out

  # ---------------------------------------------------------------------------
  # karidns-webadmin (webadmin/, 0.6.0 items D and E): the HTTP API.  Like the
  # signer job: the pinned dependency (npm audit) and the unit tests with
  # coverage (functions 100%, lines 90%, the gate of
  # tests/run_webadmin_unit_test.sh).  The unit tests need no database server:
  # the HTTP server runs on SQLite3 files made from db/*.sql, the PostgreSQL
  # side against a fake pool.  The integration tests (tests/run_webadmin_test.sh,
  # tests/run_webadmin_pg_test.sh) need the FreeBSD build and run in the FreeBSD
  # jobs.  It runs when webadmin/, node/ (shared with the signer), the SQL files, the manuals (a test compares their tables with the code, and the user manual of the web interface with the screens)
  # or this workflow change (and always on a schedule or by hand).
  # ---------------------------------------------------------------------------
  webadmin-node:
    name: webadmin (Node)
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does the change touch the WebAdmin?
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          run=true
          base=""
          [ "$EVENT" = "pull_request" ] && base="$PR_BASE"
          [ "$EVENT" = "push" ] && base="$PUSH_BEFORE"
          if [ -n "$base" ] && ! printf '%s' "$base" | grep -Eq '^0+$' && git cat-file -e "$base^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$base" HEAD | grep -Eq '^(webadmin/|node/|db/|tests/auth_vectors\.json$|tests/db/pdns_schema\.sqlite3\.sql$|tests/run_webadmin_unit_test\.sh$|karidns-webadmin\.conf\.sample$|docs/karidns-(api|webadmin|webadmin-gui|webadmin-gui-checklist)\.md$|packaging/freebsd/rc\.d/karidns_webadmin$|packaging/freebsd/build_webadmin_pkg\.sh$|signer/|karidns-signer\.conf\.sample$|docs/karidns-signer\.md$|packaging/freebsd/(rc\.d/karidns_signer|build_signer_pkg\.sh|karidns-signer|MANIFEST\.signer\.in)$|README\.md$|\.github/workflows/ci\.yml$)'; then
              run=false
              echo "webadmin/, node/, db/, the manuals and the unit test are unchanged: the job has nothing to do"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 24
        if: steps.paths.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webadmin/package-lock.json

      - name: Install the dependency (pinned, no install scripts)
        if: steps.paths.outputs.run == 'true'
        working-directory: webadmin
        run: npm ci --ignore-scripts

      - name: npm audit (high and critical fail the job)
        if: steps.paths.outputs.run == 'true'
        working-directory: webadmin
        run: npm audit --audit-level=high

      - name: Unit tests with the coverage gate (functions 100%, lines 90%)
        if: steps.paths.outputs.run == 'true'
        run: |
          node --version
          sh tests/run_webadmin_unit_test.sh < /dev/null | tee /tmp/webadmin_unit.out
          # a SKIP (no Node 22.13, say) is a failure here: the gate did not run
          if grep -Eq '^[[:space:]]*SKIP' /tmp/webadmin_unit.out; then echo "::error title=webadmin (Node)::the unit tests were skipped"; exit 1; fi
          grep -q 'all unit tests passed' /tmp/webadmin_unit.out

  build-dag-unix:
    name: Build & Smoke Test dag on ${{ matrix.name }}
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (Ubuntu)
          - os: macos-15
            name: macOS 15 (ARM64)
          - os: macos-26
            name: macOS 26 (ARM64)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sh .github/scripts/apt-install.sh libssl-dev zlib1g-dev libidn2-dev   # survives a mirror the runner cannot reach

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 zlib libidn2
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          LIBIDN2_PREFIX=$(brew --prefix libidn2 2>/dev/null || echo "")
          echo "PKG_CONFIG_PATH=${OPENSSL_PREFIX}/lib/pkgconfig:${LIBIDN2_PREFIX}/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Build dag
        run: |
          ./configure --with-db-drivers=none
          make clean
          make dag

      - name: Smoke Test dag queries
        run: |
          echo "::group::🔍 Test dag execution"
          ./dag --help || true
          # X-09: queries a local mock server (no real domains or public resolvers)
          sh ./tests/run_ci_dag_smoke.sh
          echo "::endgroup::"

      # make install-dag, install-man-dag, install-docs-dag with GNU make (tests/run_install_test.sh: only dag is built here; the server, the
      # database parts and the packages are checked by the FreeBSD job)
      - name: make install of dag (GNU make)
        if: runner.os == 'Linux'
        run: |
          sh tests/run_install_test.sh

  build-dag-windows:
    name: Build & Smoke Test dag on Windows (MinGW-w64)
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2 and MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libidn2
            make
            perl

      - name: Build dag.exe
        shell: msys2 {0}
        run: |
          ./configure --with-db-drivers=none
          make clean
          make dag

      - name: Smoke Test dag.exe queries
        shell: msys2 {0}
        run: |
          echo "::group::🔍 Test dag.exe execution"
          ./dag.exe --help || true
          # X-09: queries a local mock server (no real domains or public resolvers)
          DAG=./dag.exe sh ./tests/run_ci_dag_smoke.sh
          echo "::endgroup::"

  # ---------------------------------------------------------------------------
  # Coverage quality gate (FreeBSD only: the server core needs kqueue/Capsicum).
  # Runs on every PR (in parallel with the other jobs), on pushes to main, nightly
  # and on demand. It is also the only CI job that runs the whole integration
  # suite on FreeBSD. `make coverage` builds in parallel, skips the
  # ASan/TSan-only suites (they run in build-and-test-freebsd) and runs the
  # server fault-injection sweep and the dag network sweep in parallel lanes.
  # The test suite itself runs `tests/run_all_suite.sh -j <ncpu>` (COV_JOBS in the
  # Makefile): one port window and temporary directory per slot, tests registered
  # "serial" one by one after the parallel batch (tests/TEST_MATRIX.md).
  # The job fails when the gate's thresholds are not met or when a test of the
  # suite fails (make coverage-suite-check: success only with failed=0).
  # ---------------------------------------------------------------------------
  coverage-freebsd:
    name: Coverage gate (FreeBSD 15.1)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: make coverage inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1.4.8
        with:
          release: '15.1'
          copyback: true
          run: |
            set -e

            echo "::group::📦 [Setup] perl5 + LLVM tools matching the base clang"
            # Base llvm-cov on FreeBSD 15 aborts in "show"; the llvmNN-lite package
            # provides llvm-covNN / llvm-profdataNN, which the Makefile picks up.
            V=$(cc --version | sed -n 's/.*clang version \([0-9][0-9]*\).*/\1/p' | head -n 1)
            pkg install -y perl5 sqlite3 "llvm${V}-lite"
            # the suite runs the karidns-signer tests (tests/run_signer_*.sh): Node.js, BIND tools, signer/node_modules and webadmin/node_modules (run_webadmin_*.sh), or they SKIP (shown as a note in the suite output)
            # curl: tests/run_release_roundtrip_test.sh talks to the karidns-webadmin API with it
            pkg install -y node24 npm-node24 bind-tools curl
            (cd signer && npm ci --ignore-scripts)
            (cd webadmin && npm ci --ignore-scripts)
            echo "::endgroup::"

            echo "::group::📦 [Setup] PostgreSQL for the PostgreSQL driver tier (test_db_pgsql)"
            pkg install -y postgresql17-server postgresql17-client
            sysrc postgresql_enable=YES
            service postgresql initdb
            service postgresql start
            export KARIDNS_TEST_PG="host=127.0.0.1 user=postgres"
            export KARIDNS_TEST_PG_USER=postgres
            i=0; until pg_isready -q -h 127.0.0.1 || [ $i -ge 30 ]; do sleep 1; i=$((i + 1)); done
            echo "::endgroup::"

            echo "::group::🧪 [Coverage] make coverage"
            # the suite runs with -j $(sysctl -n hw.ncpu) (Makefile: COV_JOBS; make coverage COV_JOBS=1 runs it one test at a time)
            START=$(date +%s)
            # the compiler and the libraries as config.mk says (libpq, when it is installed, decides COV_DB_DRIVERS)
            ./configure
            # the steps of `make coverage` without its last one, coverage-suite-check: it runs after the gate, so that both results are shown
            make coverage-clean coverage-build coverage-run coverage-report < /dev/null
            echo "make coverage took $(( $(date +%s) - START ))s"
            echo "::endgroup::"

            echo "::group::🚦 [Gate] Phase 2 thresholds"
            GATE=0
            # stdin is the rest of this script (the VM action pipes it to sh): coverage_gate.pl reads a JSON summary from a piped stdin, which ate
            # the lines below ("Failed to parse JSON coverage summary", then "sh: Syntax error: Unterminated quoted string")
            perl tests/coverage_gate.pl --llvm-cov="llvm-cov${V}" --profdata=coverage.profdata --phase=2 --strict < /dev/null || GATE=$?
            echo "::endgroup::"

            echo "::group::🧪 [Suite] the result of tests/run_all_suite.sh (success only with failed=0)"
            SUITE=0
            make coverage-suite-check < /dev/null || SUITE=$?
            echo "::endgroup::"
            [ "$SUITE" -eq 0 ] || echo "::error title=Test suite::failing tests: $(sed -n 's/^failed_tests=//p' coverage_suite.status)"
            [ "$GATE" -eq 0 ] || echo "::error title=Coverage gate::the phase 2 thresholds are not met"
            [ "$GATE" -eq 0 ] && [ "$SUITE" -eq 0 ]

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage_html
          if-no-files-found: warn
