name: KariDNS CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
      - 'feature/**'
      - 'fix/**'
      - 'improve/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-freebsd:
    name: Build and Test on FreeBSD ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['14.4', '15.1']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Smoke Test inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1.4.8
        with:
          release: ${{ matrix.release }}
          run: |
            set -e

            echo "::group::📦 [Setup] Install test dependencies (perl5)"
            pkg install -y perl5 || true
            echo "::endgroup::"

            echo "::group::📦 [Build] Parallel Build KariDNS, Sanitizers, Tests & Fuzzers"
            NCPU=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)
            make -j"$NCPU" all asan tsan tools-asan fuzz fuzz_core fuzz_zone fuzz_conf fuzz_tsig fuzz_dag fuzz_tsig_verify asan_test hash_test include_test
            echo "::endgroup::"

            echo "::group::🛡️ [Security Test] Run ASan Boundary Tests"
            ./test_asan_overflow
            ./test_hash_table
            ./test_conf_include
            echo "::endgroup::"

            echo "::group::🔍 [Smoke Test] Test dag client against Google DNS"
            echo "Testing UDP query..."
            ./dag www.google.com A @8.8.8.8
            
            echo "Testing TCP query..."
            ./dag google.com TXT @8.8.8.8 +tcp

            echo "Testing mutiple UDP query..."
            ./dag www.google.com A @8.8.8.8,9.9.9.9,1.1.1.1

            echo "Testing multiple TCP query..."
            ./dag google.com TXT @8.8.8.8,9.9.9.9,1.1.1.1 +tcp
            echo "::endgroup::"

            echo "::group::🛡️ [Functional & Protocol Tests]"
            sh ./tests/run_paren_check_test.sh
            sh ./tests/run_ttl_suffix_test.sh
            sh ./tests/run_zonemd_val_test.sh
            sh ./tests/run_glue_truncation_test.sh
            sh ./tests/run_mqtype_qdcount0_test.sh
            sh ./tests/run_ixfr_roundtrip_test.sh
            sh ./tests/run_catalog_zone_test.sh
            sh ./tests/run_capsicum_axfr_test.sh
            sh ./tests/run_dynamic_update_test.sh
            sh ./tests/run_roundtrip_test.sh
            sh ./tests/run_karicheck_glue_test.sh
            sh ./tests/run_dag_compat_test.sh
            sh ./tests/run_dag_hex_payload_overflow_test.sh
            sh ./tests/run_dag_cli_options_test.sh
            sh ./tests/run_dag_trace_nssearch_tcp_test.sh
            sh ./tests/run_dag_yaml_rdata_test.sh
            sh ./tests/run_dag_badcookie_transport_test.sh
            sh ./tests/run_dag_keepopen_keepalive_test.sh
            sh ./tests/run_dag_ci_test.sh
            sh ./tests/run_phase2_core_audit_test.sh
            echo "::endgroup::"

            echo "::group::🛡️ [Sanitizer & Fuzzing] Run Comprehensive Smoke Tests"
            ./tests/run_sanitizer_smoke_test.sh
            echo "::endgroup::"

            echo ""
            echo "🎉 All FreeBSD builds and smoke tests passed!"

  build-dag-unix:
    name: Build & Smoke Test dag on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (Ubuntu)
          - os: macos-14
            name: macOS 14 (ARM64)
          - os: macos-15
            name: macOS 15 (ARM64)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev zlib1g-dev libidn2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 zlib libidn2
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          LIBIDN2_PREFIX=$(brew --prefix libidn2 2>/dev/null || echo "")
          echo "PKG_CONFIG_PATH=${OPENSSL_PREFIX}/lib/pkgconfig:${LIBIDN2_PREFIX}/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Build dag
        run: |
          make clean
          make dag

      - name: Smoke Test dag queries
        run: |
          echo "::group::🔍 Test dag execution"
          ./dag --help || true
          echo "Testing UDP query..."
          ./dag www.google.com A @8.8.8.8
          echo "Testing TCP query..."
          ./dag google.com TXT @8.8.8.8 +tcp
          echo "Testing multiple UDP query..."
          ./dag www.google.com A @8.8.8.8,9.9.9.9,1.1.1.1
          echo "::endgroup::"

  build-dag-windows:
    name: Build & Smoke Test dag on Windows (MinGW-w64)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2 and MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libidn2
            make

      - name: Build dag.exe
        shell: msys2 {0}
        run: |
          make clean
          make dag

      - name: Smoke Test dag.exe queries
        shell: msys2 {0}
        run: |
          echo "::group::🔍 Test dag.exe execution"
          ./dag.exe --help || true
          echo "Testing UDP query..."
          ./dag.exe www.google.com A @8.8.8.8
          echo "Testing TCP query..."
          ./dag.exe google.com TXT @8.8.8.8 +tcp
          echo "Testing multiple UDP query..."
          ./dag.exe www.google.com A @8.8.8.8,9.9.9.9,1.1.1.1
          echo "::endgroup::"
