name: KariDNS FreeBSD build and test

# ---------------------------------------------------------------------------
# The build and the tests of one FreeBSD release.  ci.yml calls this workflow for 14.4 and 15.1 (job freebsd); it can also be started alone from the
# Actions page (workflow_dispatch, input: release).
#
# One job builds everything once (build: ./configure --march=none, the server, the tools, the sanitizer and fuzz builds, the unit test binaries) and checks
# ./configure, the manual pages and make install.  It packs what the build made into one archive (tests/coverage_pack.sh, the same as the coverage jobs of
# ci.yml use for cov-bins) and uploads it.  The test jobs (build-and-test: unit tests plain and under ASan/UBSan, smoke tests; functional: the functional
# and protocol tests and the signer / WebAdmin tests; webadmin-gui: the browser tests, 15.1 only) download it, unpack it (the files are newer than the
# sources, so no make target rebuilds anything) and only run tests.  A test job fails when its run made an object file or a program (tests/coverage_pack.sh
# unpack leaves every file older than .unpack_stamp: whatever is newer than the stamp was built by a test).
# --march=none: the build runs on one runner and the tests on others, whose CPUs differ (-march=native died with SIGILL on a runner of another CPU, and with
# LTO it gave about 1200 lines "invalid feature combination: +avx10.1-256").
#
# The PostgreSQL tests (the unit tests test_db_pgsql and test_zone_import, the functional tests) run with --pg-clusters: one PostgreSQL cluster per test slot,
# started and stopped by tests/run_all_suite.sh, so that the VM needs only the server package, not a started service (and the tests of the group pg no
# longer wait for each other).
# A hung test must fail the job instead of blocking it for hours: every test has a timeout (--test-timeout), the job has timeout-minutes.
# ---------------------------------------------------------------------------
on:
  workflow_call:
    inputs:
      release:
        description: 'FreeBSD release'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release:
        description: 'FreeBSD release'
        required: true
        default: '15.1'
        type: choice
        options:
          - '14.4'
          - '15.1'

jobs:
  build:
    name: Build on FreeBSD ${{ inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and checks inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1.4.8
        with:
          release: ${{ inputs.release }}
          copyback: true
          run: |
            set -e
            # everything the build makes is newer than this file (tests/coverage_pack.sh pack: no git in the VM needed)
            touch .build_stamp

            echo "::group::📦 [Setup] Install dependencies (perl5, sqlite3 for karidns-dbloader and its tests)"
            # no "|| true": the manual-page gate below needs perl (a failed install must fail here, as the coverage job does)
            pkg install -y perl5
            pkg install -y sqlite3
            echo "::endgroup::"

            echo "::group::📦 [Setup] Node.js, BIND tools and the npm dependencies of karidns-signer and karidns-webadmin"
            # tests/run_install_test.sh builds the signer and WebAdmin packages (npm ci, bind-tools); it SKIPs without these
            pkg install -y node24 npm-node24 bind-tools
            (cd signer && npm ci --ignore-scripts)
            (cd webadmin && npm ci --ignore-scripts)
            node --version
            dnssec-signzone -V
            echo "::endgroup::"

            echo "::group::📦 [Setup] libpq (PostgreSQL driver of karidns-dbloader, B10)"
            pkg install -y postgresql17-client
            echo "::endgroup::"

            echo "::group::📦 [Build] Parallel Build KariDNS, Sanitizers, Tests & Fuzzers"
            NCPU=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)
            # configure finds the compiler and the libraries and writes config.mk, which every make below reads (docs/building.md); both database drivers are built.
            # The list is the union of what the test jobs use: the server, the tools, the loader, karidns-zone, the helpers of the DB tests, karidns-evict, the
            # sanitizer builds, the fuzz builds (fuzz_dag_all: run_dag_fuzzer_test.sh), test_response_cache (run_response_cache_test.sh runs the binary; its own
            # fallback compile line lacks sources the engine needs now and does not link) and the unit test binaries, plain and ASan
            ./configure --march=none --with-db-drivers="sqlite3 postgresql" --with-idn2=yes
            make -j"$NCPU" all karicheck-codelog test_coverage_sweep_tools-codelog karidns-dbloader karidns-zone karidns-zone-asan zone2sql zone2kdb asan tsan tools-asan dnsqps-tsan fuzz_all fuzz_dag_all asan_test tinydns_test hash_test include_test response_cache_test test_response_cache vulnerability_test bench_serialize fetch_backend fake_dbloader karidns-evict test_store_status tsan-test-bins karidns-dbloader-tsan
            # stdin from /dev/null: no test may block reading the VM session's stdin
            make -j"$NCPU" unit-test-bins unit-test-bins-asan < /dev/null
            echo "::endgroup::"

            echo "::group::📦 [Pack] the build, for the test jobs"
            sh tests/coverage_pack.sh pack freebsd-bins.tar.zst .build_stamp
            ls -l freebsd-bins.tar.zst
            echo "::endgroup::"

            echo "::group::🔧 [Configure] ./configure and config.mk: the same compile lines with and without it (BSD make and GNU make)"
            # tests/run_configure_test.sh works in a copy of the sources; gmake is not installed here, so GNU make is checked by the Linux job
            sh tests/run_configure_test.sh < /dev/null
            echo "::endgroup::"

            echo "::group::📖 [Manual pages] man/ is what make man makes of docs/*.md; mandoc -T lint"
            # tests/run_md2man_test.sh: the converter's fixtures, the committed pages against a fresh man/generate.sh, no mandoc message at WARNING
            # or worse (perl5 is installed above, mandoc is in the base system; KARIDNS_TEST_REQUIRE=1: a missing perl or mandoc is a failure, not a SKIP).
            # A stale page fails here: run make man and commit the pages
            KARIDNS_TEST_REQUIRE=1 sh tests/run_md2man_test.sh < /dev/null
            echo "::endgroup::"

            echo "::group::📦 [Install] make install against tests/install_manifest.txt; the packages list what make install stages"
            # tests/run_install_test.sh in a copy with the binaries built above: make install / uninstall (BSD make), other directories, and
            # build_pkg.sh --no-build for karidns and karidns-db plus the signer and WebAdmin packages (npm ci): their file lists, modes and metadata
            sh tests/run_install_test.sh < /dev/null
            echo "::endgroup::"

            echo "::group::📦 [Pack] remove the build from the workspace (the copyback of the VM action takes the archive, not the build)"
            sh tests/coverage_pack.sh clean freebsd-bins.tar.zst
            rm -f .build_stamp
            rm -rf signer/node_modules webadmin/node_modules
            echo "::endgroup::"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-bins-${{ inputs.release }}
          path: freebsd-bins.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  build-and-test:
    name: Build and Test on FreeBSD ${{ inputs.release }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # before the VM step: the VM action copies the workspace into the VM when its step starts
      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: freebsd-bins-${{ inputs.release }}

      - name: Unit tests and smoke tests inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1.4.8
        with:
          release: ${{ inputs.release }}
          copyback: false
          run: |
            set -e

            echo "::group::📦 [Setup] Install test dependencies (perl5, sqlite3 for karidns-dbloader and its tests)"
            pkg install -y perl5
            pkg install -y sqlite3
            echo "::endgroup::"

            echo "::group::📦 [Setup] Node.js, BIND tools and the npm dependency of karidns-signer (0.6.0 item C)"
            # karidns-signer is Node.js orchestration around BIND's dnssec-keygen / dnssec-signzone / dnssec-verify (bind-tools); signer/ has one
            # npm dependency (pg, exact version in package-lock.json), installed without install scripts.  The signer tests SKIP without these.
            # curl: tests/run_release_roundtrip_test.sh talks to the karidns-webadmin API with it
            pkg install -y node24 npm-node24 bind-tools curl
            (cd signer && npm ci --ignore-scripts)
            (cd webadmin && npm ci --ignore-scripts)
            node --version
            dnssec-signzone -V
            echo "::endgroup::"

            echo "::group::📦 [Setup] PostgreSQL server and libpq (PostgreSQL driver of karidns-dbloader, B10)"
            # The job runs inside this VM, so a PostgreSQL "service" is a server started here (a service container of the runner is not
            # reachable from the VM).  No service is started: tests/run_all_suite.sh --pg-clusters (the unit tests below) runs initdb for
            # every test slot, as the user postgres (the package makes it), with trust authentication on 127.0.0.1; the tests create and
            # drop their own databases and roles (karidns_test_*) in it (tests/db/pg_lib.sh).
            pkg install -y postgresql17-server postgresql17-client
            export KARIDNS_TEST_PG_USER=postgres
            echo "::endgroup::"

            echo "::group::📦 [Unpack] the build of the job build"
            # tar -m: the files are newer than the sources, no make target rebuilds them; the stamp is newer than every unpacked file
            sh tests/coverage_pack.sh unpack freebsd-bins.tar.zst
            rm -f freebsd-bins.tar.zst
            touch .unpack_stamp
            echo "::endgroup::"

            echo "::group::🧪 [Unit Tests] All C unit tests (incl. RFC published-vector tests), 4 at a time"
            # Same tests as `make unit-tests` (plus test_acl_match and test_listen_on), run by tests/run_all_suite.sh: 4 at a time,
            # tests that share a resource (the PostgreSQL server) one after the other, each test with its own log, which is printed
            # in full when the test fails.  The coverage sweeps are not part of unit-tests (the coverage job runs them).
            # The test binaries were built by the job build (stdin from /dev/null: no test may block reading the VM session's stdin).
            sh tests/run_all_suite.sh -j 4 --test-timeout 1200 --full-log --pg-clusters -c unit -e coverage_sweep < /dev/null
            echo "::endgroup::"

            echo "::group::🛡️ [Sanitizers] Unit tests under ASan + UBSan, 4 at a time"
            # The plain test_* binaries use production CFLAGS, so they are NOT sanitizer-checked
            # (test_asan_overflow included). The job build made every unit test with
            # -fsanitize=address,undefined (UBSan findings are fatal); leak checks are off by default
            # (UT_ASAN_LEAKS=1 enables them once the tests' teardown is complete).
            # Blocking: any ASan/UBSan unit-test failure fails the job (a missing -asan binary too).
            # --asan runs the same binaries as make unit-tests-asan does (tests/run_unit_with_watchdog.sh, UT_TIMEOUT 300 s each), 4 at a time;
            # like it, not the test_fi_* fault-injection tests (no -asan build)
            sh tests/run_all_suite.sh -j 4 --test-timeout 1200 --full-log --pg-clusters --asan -e coverage_sweep,test_fi_ < /dev/null
            echo "::endgroup::"

            echo "::group::🔍 [Smoke Test] Test dag client against a local mock server"
            # X-09: no real domains or public resolvers (UDP, TCP, multiple servers, AXFR)
            sh ./tests/run_ci_dag_smoke.sh
            echo "::endgroup::"

            echo "::group::🛡️ [Sanitizers] dnsqps under ASan/UBSan and TSan: the engine, its threads and the I/O paths (tests/run_dnsqps_test.sh)"
            DNSQPS=./dnsqps-asan sh ./tests/run_dnsqps_test.sh
            DNSQPS=./dnsqps-tsan sh ./tests/run_dnsqps_test.sh
            echo "::endgroup::"

            echo "::group::🛡️ [Sanitizer & Fuzzing] Run Comprehensive Smoke Tests"
            ./tests/run_sanitizer_smoke_test.sh
            echo "::endgroup::"

            echo "::group::🔨 [Check] no test built anything"
            sh tests/freebsd_no_rebuild_check.sh .unpack_stamp
            echo "::endgroup::"

            echo ""
            echo "🎉 All FreeBSD unit and smoke tests passed!"

  # ---------------------------------------------------------------------------
  # ThreadSanitizer (15.1): the RCU and lock-free tests the coverage suite leaves out (Makefile: COV_SUITE_EXCLUDE): tests/run_rcu_tsan_units_test.sh (the
  # unit tests of the lock-free parts, the -tsan binaries of make tsan-test-bins) and tests/run_rcu_tsan_test.sh (karidns-tsan under queries, reloads,
  # UPDATE, AXFR / IXFR, the DB cache, transfers of zones out of memory, the loader's fetch workers with karidns-dbloader-tsan, stalled transfers; root and
  # SQLite3 for parts 4 to 7).  Any ThreadSanitizer report fails the test.  A job of its own: about 10 minutes next to the other test jobs.
  # ---------------------------------------------------------------------------
  tsan:
    name: ThreadSanitizer RCU tests on FreeBSD ${{ inputs.release }}
    if: inputs.release == '15.1'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: freebsd-bins-${{ inputs.release }}

      - name: TSan tests inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1.4.8
        with:
          release: ${{ inputs.release }}
          copyback: false
          run: |
            set -e

            echo "::group::📦 [Setup] perl5, sqlite3 (parts 4 to 7 of run_rcu_tsan_test.sh: database zones on SQLite3)"
            pkg install -y perl5 sqlite3
            echo "::endgroup::"

            echo "::group::📦 [Unpack] the build of the job build"
            sh tests/coverage_pack.sh unpack freebsd-bins.tar.zst
            rm -f freebsd-bins.tar.zst
            touch .unpack_stamp
            echo "::endgroup::"

            echo "::group::🧵 [TSan] run_rcu_tsan_units_test, run_rcu_tsan_test (one after the other: the server half has time bounds)"
            # --skip-allow: a part that SKIPs (not root, no SQLite3, a missing -tsan build) fails the job; tests/ci_skip_allow.txt names the two parts that cannot run here
            sh ./tests/run_all_suite.sh -j 1 --test-timeout 1500 --full-log --skip-allow tests/ci_skip_allow.txt --tests run_rcu_tsan_units_test,run_rcu_tsan_test < /dev/null
            # the log of a passing test is not printed: the parts that ran
            grep -h -E '^--- part|^PASS: no ThreadSanitizer report' tests/.test_logs/test_*.log || true
            echo "::endgroup::"

            echo "::group::🔨 [Check] no test built anything"
            sh tests/freebsd_no_rebuild_check.sh .unpack_stamp
            echo "::endgroup::"

  # ---------------------------------------------------------------------------
  # The functional and protocol tests and the karidns-signer / karidns-webadmin tests, which need the server, the tools, the database tools and the ASan
  # builds of a few programs.  Both lists run with --pg-clusters (one PostgreSQL per test slot; the group pg of the registry is dropped, the PostgreSQL tests
  # run next to the others).
  # ---------------------------------------------------------------------------
  functional:
    name: Functional tests on FreeBSD ${{ inputs.release }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: freebsd-bins-${{ inputs.release }}

      - name: Functional tests inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1.4.8
        with:
          release: ${{ inputs.release }}
          copyback: false
          run: |
            set -e

            echo "::group::📦 [Setup] Install test dependencies (perl5, sqlite3 for karidns-dbloader and its tests)"
            pkg install -y perl5
            pkg install -y sqlite3
            echo "::endgroup::"

            echo "::group::📦 [Setup] Node.js, BIND tools and the npm dependencies of karidns-signer and karidns-webadmin"
            # the signer and WebAdmin tests SKIP without these (and then fail here: --fail-on-skip below).  curl: tests/run_release_roundtrip_test.sh talks to
            # the karidns-webadmin API with it
            pkg install -y node24 npm-node24 bind-tools curl
            (cd signer && npm ci --ignore-scripts)
            (cd webadmin && npm ci --ignore-scripts)
            node --version
            dnssec-signzone -V
            echo "::endgroup::"

            echo "::group::📦 [Setup] PostgreSQL server and libpq (PostgreSQL driver of karidns-dbloader, B10)"
            # No service: tests/run_all_suite.sh --pg-clusters starts a cluster per test slot as the user postgres (see build-and-test)
            pkg install -y postgresql17-server postgresql17-client
            export KARIDNS_TEST_PG_USER=postgres
            echo "::endgroup::"

            echo "::group::📦 [Unpack] the build of the job build"
            # tar -m: the files are newer than the sources, no make target rebuilds them; the stamp is newer than every unpacked file
            sh tests/coverage_pack.sh unpack freebsd-bins.tar.zst
            rm -f freebsd-bins.tar.zst
            touch .unpack_stamp
            echo "::endgroup::"

            echo "::group::🛡️ [Functional & Protocol Tests] 4 at a time"
            # The tests of this list, run by tests/run_all_suite.sh: 4 at a time, each in its own port window and temporary directory (KARI_PORT_BASE,
            # KARI_TMP) and, with --pg-clusters, its own PostgreSQL; the ones that share a resource (loopback aliases, one server's files, fixed ports) are
            # registered as group or serial there and run one at a time.  A failed test prints its whole log.  --tests refuses a name that is not registered.
            FUNC_TESTS="\
              run_paren_check_test,run_ttl_suffix_test,run_zonemd_val_test,run_glue_truncation_test,run_mqtype_qdcount0_test,\
              run_ixfr_roundtrip_test,run_catalog_zone_test,run_capsicum_axfr_test,run_dynamic_update_test,run_roundtrip_test,\
              run_karicheck_glue_test,run_dag_ci_test,run_phase2_core_audit_test,run_phase2_audit_part2_test,run_tinydns_location_test,\
              run_bind_ecs_subnet_test,run_response_section_order_test,run_sibling_additional_test,run_multi_instance_test,\
              run_extended_axfr_test,run_dnstap_capture_test,run_karicheck_semantic_lint_test,run_db_dump_test,run_db_sqlite_basic_test,\
              run_db_file_diff_test,run_db_hostile_loader_test,run_db_ddl_test,run_db_schema_migrate_test,run_db_pg_sqlite_diff_test,\
              run_db_pg_autoreload_test,run_db_pg_role_test,run_db_auth_schema_test,run_db_auth_rls_test,\
              run_karicheck_database_conf_test,run_karicheck_json_test,run_karicheck_codes_test,run_dag_update_generic_rdata_test,\
              run_karictl_observatory_test,run_axfr_multikey_tsig_test,run_config_duplicate_rejection_test,run_cve_coo_test,\
              run_dag_batch_advanced_opts_test,run_dag_fuzzer_test,run_dnssec_negative_soa_rrsig_test,run_domain_length_rfc1035_test,\
              run_ds_delegation_test,run_karictl_reload_reconfig_test,run_logging_channel_validation_test,run_mx_srv_glue_test,\
              run_notify_source_test,run_privilege_drop_root_test,run_nonroot_startup_test,run_query_log_rate_limit_test,\
              run_response_cache_test,run_rrl_window_test,run_tinydns_timestamp_test,run_ttl_harmonization_test,\
              run_ttl_harmonization_update_test,run_ttl_rfc2181_clamp_test,run_update_secondary_refused_test,\
              run_zone_oom_partial_load_test,run_zone_type_secondary_test,\
              run_dnsqps_test,run_dnsqps_karidns_test,run_dnsqps_netmap_test"
            export DNSQPS_TEST_REQUIRE=1   # tests/run_dnsqps_netmap_test.sh: a SKIP (no /dev/netmap) must fail here
            sh ./tests/run_all_suite.sh -j 4 --test-timeout 1200 --full-log --pg-clusters --tests "$FUNC_TESTS" < /dev/null
            # the log of a passing test is not printed: show what tests/run_dnsqps_karidns_test.sh checked, and fail when it never reached its PASS line (a SKIP or a short circuit)
            grep -h -E '^ok: (query file|generated mode|option sets|per-line options)|^PASS: dnsqps against karidns' tests/.test_logs/test_*.log || true
            grep -q '^PASS: dnsqps against karidns' tests/.test_logs/test_*.log || { echo "::error title=dnsqps::run_dnsqps_karidns_test.sh did not reach its PASS line"; exit 1; }
            echo "::endgroup::"

            echo "::group::🔏 [Signer, WebAdmin] karidns-signer and karidns-webadmin: unit tests, SQLite3 and PostgreSQL (root: with a server)"
            # A SKIP of a whole script must fail here (tests/run_all_suite.sh shows it as a note of a PASS): node24, bind-tools, signer/node_modules and webadmin/node_modules are installed above
            # The browser tests of the web interface (category gui of the suite) run in the job webadmin-gui; the OpenID Connect test runs here without its browser part
            NODE_TESTS="run_signer_unit_test,run_signer_test,run_signer_pg_test,run_signer_lock_test,run_webadmin_unit_test,run_webadmin_test,run_webadmin_pg_test,run_webadmin_write_test,run_webadmin_write_pg_test,run_webadmin_versions_test,run_webadmin_versions_pg_test,run_webadmin_oidc_test,run_webadmin_pkg_test,run_signer_pkg_test,run_release_roundtrip_test"
            # 4 at a time through tests/run_all_suite.sh.  --serial-as-par: some of them are registered "serial" there (the others run next to the other tests since 0.6.2); every one of them
            # takes its ports (kari_port), its directory (mktemp) and its PostgreSQL roles and databases ($$) of its own.  --fail-on-skip: a test that exits 0 but prints a SKIP line
            # fails the job, as the loop did before
            sh ./tests/run_all_suite.sh -j 4 --test-timeout 1200 --serial-as-par --full-log --fail-on-skip --pg-clusters --tests "$NODE_TESTS" < /dev/null
            echo "::endgroup::"

            echo "::group::🔨 [Check] no test built anything"
            sh tests/freebsd_no_rebuild_check.sh .unpack_stamp
            echo "::endgroup::"

  # ---------------------------------------------------------------------------
  # The browser tests of the web interface (0.7: category gui of tests/run_all_suite.sh, left out of a plain suite run): Firefox headless through geckodriver
  # on FreeBSD 15.1 (the packages are built for 15.x; the job is skipped for another release).  A job of its own, so that a flaky browser step does not fail
  # the server's build-and-test job.  It runs on every push to main, by hand, and on a pull request that touches the web interface, the service, the code
  # they share, their tests or the workflows, or a source of the programs the scenarios run besides the server (karidns-zone, karicheck, karidns-dbloader,
  # karictl, dag: the files the Makefile links into them, the database code included); a change to a file that only the server links does not start a browser.
  # ---------------------------------------------------------------------------
  webadmin-gui:
    name: WebAdmin browser tests (FreeBSD 15.1)
    if: inputs.release == '15.1'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does the change touch the web interface?
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          run=true
          if [ "$EVENT" = "pull_request" ] && [ -n "$PR_BASE" ] && git cat-file -e "$PR_BASE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$PR_BASE" HEAD | grep -Eq '^(webadmin/|node/|db/|tests/lib_webadmin_gui\.sh$|tests/run_webadmin_(gui|gui_pg|oidc|oidc_gui)_test\.sh$|tests/run_all_suite\.sh$|tests/lib_proc\.sh$|\.github/workflows/(ci|freebsd)\.yml$|tests/coverage_pack\.sh$|tests/freebsd_no_rebuild_check\.sh$|tools/(karidns_zone|karicheck|karictl|karidns_tool_linkage|dag[a-z0-9_]*|dnstap_decode)\.[ch]$|karidns_dbloader\.c$|dns_(zone_(import|export|changes|render|msg|text|rows|lint|parser)|pdns_reader|presigned|db_[a-z0-9_]+|tinydns_parser|config_parser|tsig_acl|diag|wire|utils|cidr)\.[ch]$)'; then
              run=false
              echo "the web interface, the service, the tools the scenarios run, their tests and the workflows are unchanged: the browser tests are not run"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Download the build
        if: steps.paths.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: freebsd-bins-${{ inputs.release }}

      - name: Browser tests inside FreeBSD VM
        if: steps.paths.outputs.run == 'true'
        uses: vmactions/freebsd-vm@v1.4.8
        with:
          release: ${{ inputs.release }}
          copyback: false
          run: |
            set -e

            echo "::group::📦 [Setup] perl5, sqlite3, Node.js, PostgreSQL, Firefox and geckodriver"
            # Firefox crashes at the start without a font.  The tests use no network (a profile that talks to nothing, everything on 127.0.0.1): the network is for this step only.
            # The packages preinstalled in the VM image can be older than the repository: pkg keeps an installed library whose soname
            # is unchanged (libffi.so.8 lacked the LIBFFI_CALL_PLAN_8.4 symbol version libxul.so needs), so bring them up to date first.
            pkg upgrade -y
            pkg install -y perl5 sqlite3 node24 npm-node24 curl postgresql17-server postgresql17-client firefox geckodriver dejavu
            (cd webadmin && npm ci --ignore-scripts)
            node --version
            firefox --version
            geckodriver --version | head -1
            sysrc postgresql_enable=YES
            service postgresql initdb
            service postgresql start
            export KARIDNS_TEST_PG="host=127.0.0.1 user=postgres"
            export KARIDNS_TEST_PG_USER=postgres
            i=0; until pg_isready -q -h 127.0.0.1 || [ $i -ge 30 ]; do sleep 1; i=$((i + 1)); done
            echo "::endgroup::"

            echo "::group::📦 [Unpack] the build of the job build (the server, the loader and the tools the browser tests use)"
            # the packages above were upgraded after the build's libraries were installed in another VM of the same image: the same libraries, as the
            # build job installs libpq from the same repository
            sh tests/coverage_pack.sh unpack freebsd-bins.tar.zst
            rm -f freebsd-bins.tar.zst
            touch .unpack_stamp
            echo "::endgroup::"

            echo "::group::🌐 [Browser] the tests of the category gui, one after the other (a Firefox each; the memory of the VM)"
            # --fail-on-skip: a test that exits 0 but prints a SKIP line fails the job
            sh ./tests/run_all_suite.sh -j 1 --test-timeout 600 --full-log --fail-on-skip --only-gui < /dev/null
            echo "::endgroup::"

            echo "::group::🔨 [Check] no test built anything"
            sh tests/freebsd_no_rebuild_check.sh .unpack_stamp
            echo "::endgroup::"
