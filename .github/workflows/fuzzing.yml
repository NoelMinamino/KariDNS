name: KariDNS Continuous Fuzzing & Stress Test

on:
  schedule:
    # Run every night at 19:00 UTC (04:00 JST next morning)
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: 'Duration (in seconds) per fuzz target'
        required: true
        default: '1800'
      runs_target:
        description: 'Maximum runs per target (leave empty for time-based)'
        required: false
        default: ''

jobs:
  nightly-fuzz-freebsd:
    name: Nightly Deep Fuzzing (FreeBSD 15.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore Fuzzer Corpus Cache
        uses: actions/cache/restore@v4
        id: corpus-cache
        with:
          path: tests/fuzz/corpus_*
          key: fuzzer-corpus-freebsd-15-${{ github.run_id }}
          restore-keys: |
            fuzzer-corpus-freebsd-15-
            fuzzer-corpus-

      - name: Run Continuous Fuzzing in FreeBSD VM
        uses: vmactions/freebsd-vm@v1.4.8
        with:
          release: '15.1'
          run: |
            set -e
            FUZZ_TIME="${{ inputs.fuzz_seconds || '1800' }}"
            FUZZ_RUNS_INPUT="${{ inputs.runs_target || '' }}"

            echo "::group::📦 [Build] Build all libFuzzer targets in parallel"
            NCPU=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)
            make -j"$NCPU" fuzz fuzz_core fuzz_zone fuzz_conf fuzz_tsig fuzz_dag fuzz_tsig_verify \
                fuzz_dag_hash fuzz_dag_chunked_http fuzz_dag_rdata_yaml fuzz_dag_axfr_stream fuzz_dag_cli_args fuzz_dag_batch_file
            echo "::endgroup::"

            echo "::group::🛡️ [Fuzzing] Continuous Deep Fuzzing (${FUZZ_TIME}s per target, max 2 parallel, rss_limit_mb=2500)"
            FAILED=0
            active_pids=""
            MAX_JOBS=2

            for target in fuzz_dns_wire fuzz_dns_server_core fuzz_zone_parser fuzz_conf_parser fuzz_tsig_sign fuzz_dag_response fuzz_tsig_verify \
                          fuzz_dag_hash fuzz_dag_chunked_http fuzz_dag_rdata_yaml fuzz_dag_axfr_stream fuzz_dag_cli_args fuzz_dag_batch_file; do
                bin="tests/fuzz/$target"
                corpus="tests/fuzz/corpus_$target"
                mkdir -p "$corpus"
                echo "[+] Fuzzing target: $target (corpus size: $(ls -1 "$corpus" 2>/dev/null | wc -l) files)"
                if [ -n "$FUZZ_RUNS_INPUT" ]; then
                    "$bin" -runs="$FUZZ_RUNS_INPUT" -rss_limit_mb=2500 -close_fd_mask=3 "$corpus" > "fuzz_${target}.log" 2>&1 &
                else
                    "$bin" -max_total_time="$FUZZ_TIME" -rss_limit_mb=2500 -close_fd_mask=3 "$corpus" > "fuzz_${target}.log" 2>&1 &
                fi
                active_pids="$active_pids $target:$!"

                count=$(echo $active_pids | wc -w)
                if [ "$count" -ge "$MAX_JOBS" ]; then
                    for tp in $active_pids; do
                        t="${tp%%:*}"
                        p="${tp##*:}"
                        wait $p || {
                            echo "❌ Fuzzer target $t crashed or failed! (see fuzz_${t}.log)"
                            tail -n 60 "fuzz_${t}.log"
                            FAILED=1
                        }
                    done
                    active_pids=""
                fi
            done

            for tp in $active_pids; do
                t="${tp%%:*}"
                p="${tp##*:}"
                wait $p || {
                    echo "❌ Fuzzer target $t crashed or failed! (see fuzz_${t}.log)"
                    tail -n 60 "fuzz_${t}.log"
                    FAILED=1
                }
            done

            if [ "$FAILED" -ne 0 ]; then
                echo "One or more fuzzers detected crashes/memory errors!"
                exit 1
            fi
            echo "🎉 All fuzz targets survived without crashes!"
            echo "::endgroup::"

      - name: Save Updated Fuzzer Corpus Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tests/fuzz/corpus_*
          key: fuzzer-corpus-freebsd-15-${{ github.run_id }}
