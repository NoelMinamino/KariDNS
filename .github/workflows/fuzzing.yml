name: KariDNS Continuous Fuzzing & Stress Test

# Every harness of tests/fuzz/targets.sh runs every night, in 4 shards (tests/run_fuzz_nightly.sh).  Each shard has
# about 11 targets, runs 4 at a time for fuzz_seconds each: 3 rounds x 2700 s = 2 h 15 min, plus the VM and the build,
# well inside the 6 h job limit.  (Until 2026-11 one job ran 41 targets x 1800 s, 2 at a time: 10.5 h, cancelled at
# 6 h every night, 17 targets never started, and a cancelled job saved neither the corpus nor the crash input.)
# A failing target fails its shard; its log, its crash / oom input and a rerun of that input with the output open
# are uploaded as the artifact fuzz-shard-<n>.

on:
  schedule:
    # Run every night at 19:00 UTC (04:00 JST next morning)
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: 'Duration (in seconds) per fuzz target (3 rounds per shard: keep it at most 4800)'
        required: true
        default: '2700'
      runs_target:
        description: 'Maximum runs per target (leave empty for time-based)'
        required: false
        default: ''

jobs:
  nightly-fuzz-freebsd:
    name: Nightly Deep Fuzzing (FreeBSD 15.1, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore Fuzzer Corpus Cache
        uses: actions/cache/restore@v4
        with:
          path: tests/fuzz/corpus_*
          key: fuzzer-corpus-freebsd-15-shard${{ matrix.shard }}-${{ github.run_id }}
          # the corpora of the one-job runs (before the shards) are the starting point of every shard
          restore-keys: |
            fuzzer-corpus-freebsd-15-shard${{ matrix.shard }}-
            fuzzer-corpus-freebsd-15-

      - name: Run Continuous Fuzzing in FreeBSD VM
        uses: vmactions/freebsd-vm@v1.4.8
        # a step that runs over its time fails (the steps below still run); the shard plan ends well before
        timeout-minutes: 330
        with:
          release: '15.1'
          mem: '12288'
          cpu: '4'
          run: |
            set -e
            echo "::group::[Build] all libFuzzer targets"
            NCPU=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)
            ./configure
            make -j"$NCPU" fuzz_all
            echo "::endgroup::"
            FUZZ_SHARD='${{ matrix.shard }}' FUZZ_SHARDS=4 FUZZ_JOBS=4 \
              FUZZ_SECONDS='${{ inputs.fuzz_seconds || '2700' }}' FUZZ_RUNS='${{ inputs.runs_target || '' }}' \
              FUZZ_OUT=fuzz_out sh tests/run_fuzz_nightly.sh

      - name: Upload logs and crash inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-shard-${{ matrix.shard }}
          path: fuzz_out/
          if-no-files-found: warn
          retention-days: 14

      - name: Save Updated Fuzzer Corpus Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tests/fuzz/corpus_*
          key: fuzzer-corpus-freebsd-15-shard${{ matrix.shard }}-${{ github.run_id }}
